const s={lang:'en',stage:0,closed:false,type:'BD',lookup:null,bdPassport:'',foreign:{passport:'',name:'',dob:'',country:''},medical:false,suggestions:false,passengers:[],editing:null,error:'',mode:'LAND',landPort:'',waterPort:'',destination:'',travelDate:'',phone:'',email:'',channel:'NOW',group:'mfs',provider:'',ack:false};
const $=id=>document.getElementById(id);const tr=(str)=>s.lang==='bn'?(t[str]||str):str;const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const h=x=>esc(x);const T=x=>h(tr(x));const money=x=>`${s.lang==='bn'?'৳':'৳'}${new Intl.NumberFormat(s.lang==='bn'?'bn-BD':'en-US',{maximumFractionDigits:0}).format(x)}`;
const dateToday=()=>{const p=new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Dhaka',year:'numeric',month:'2-digit',day:'2-digit'}).formatToParts(new Date());const d=Object.fromEntries(p.map(z=>[z.type,z.value]));return `${d.year}-${d.month}-${d.day}`};
function validDate(x){if(!/^\d{4}-\d{2}-\d{2}$/.test(x))return false;const d=new Date(x+'T00:00:00Z');return !isNaN(d.getTime())&&d.toISOString().slice(0,10)===x}
function ageAt(dob,at){if(!validDate(dob)||!validDate(at)||dob>at)return null;const b=dob.split('-').map(Number),d=at.split('-').map(Number);return d[0]-b[0]-((d[1]<b[1]||(d[1]===b[1]&&d[2]<b[2]))?1:0)}
function amount(p){const age=ageAt(p.dob,s.travelDate);if(age===null)return null;const base=s.mode==='LAND'?1000:1200;return age<=5?0:age<10?base/2:base}
function canCalc(){return s.passengers.length>0&&s.destination.trim()&&((s.mode==='LAND'?s.landPort:s.waterPort).trim())&&validDate(s.travelDate)&&s.travelDate>=dateToday()}
function total(){return canCalc()?s.passengers.reduce((v,p)=>v+(amount(p)||0),0):null}
function masked(p){let z=p.passport||'';return '••••'+z.slice(-4)}
function field(id,label,val,opts={}){return `<div class="field"><label for="${id}">${T(label)}${opts.required?' <span class="req">*</span>':''}</label><input id="${id}" data-field="${id}" type="${opts.type||'text'}" ${opts.placeholder?`placeholder="${T(opts.placeholder)}"`:''} ${opts.min?`min="${h(opts.min)}"`:''} ${opts.max?`max="${h(opts.max)}"`:''} ${opts.maxlength?`maxlength="${opts.maxlength}"`:''} ${opts.list?`list="${opts.list}"`:''} autocomplete="off" value="${h(val)}"/>${opts.hint?`<p class="field-hint">${T(opts.hint)}</p>`:''}</div>`}
function infoRows(p){return `<dl class="info-rows">${[['Passenger name',p.name],['Passport number',p.passport],['Date of birth',p.dob],['Nationality',p.type==='BD'?'Bangladeshi':p.country]].map(([a,b])=>`<div class="info-row"><dt>${T(a)}</dt><dd>${h(b)}</dd></div>`).join('')}</dl>`}
function header(){const title=['Passenger Information','Travel Details','Final Preview','Payment Channel','Simulation Result'][s.stage];const progress=s.stage<=2?(s.stage+1)*100/3:100;return `<div class="page"><div class="page-head"><div class="logo"><span class="logo-mark">◈</span><span>সহজকর <span style="font-weight:500;font-size:12px;opacity:.7">Sohojkor</span></span></div><div class="site-links"><span class="active">Home</span><span>User guide</span><span>Report</span></div><div class="meta"><span class="sim-pill">${T('Prototype only')}</span><button class="lang" data-action="lang">${s.lang==='en'?'বাংলা':'English'}</button></div></div><section class="shell" aria-label="Travel Tax interactive simulation">${s.closed?`<div class="closed"><div><span class="pill">${T('Prototype only')}</span><h2>${T('Simulation Result')}</h2><p>${T('Payments, bank settlement, receipts and SQL writes are intentionally disabled.')}</p><button class="btn btn-primary" data-action="reopen">${T('Restart simulation')} →</button></div></div>`:`<header class="header"><button class="icon-btn" aria-label="${T('Back')}" title="${T('Back')}" data-action="back">‹</button><div class="heading"><h1>${T(title)}</h1><p>${T('Walk-in Payment')}</p></div><button class="icon-btn" aria-label="${T('Close')}" data-action="close">×</button></header><div class="progress" role="progressbar" aria-label="Travel Tax progress" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${progress}"><span style="width:${progress}%"></span></div>${s.stage===4?endPage():`<div class="body"><main class="main">${s.error?`<div class="error" role="alert">${T(s.error)}</div>`:''}${s.stage===0?passengerScreen():s.stage===1?travelScreen():s.stage===2?previewScreen():channelScreen()}</main>${aside()}</div>${footer()}`}`}</section><p class="foot-note">${T('No real payment or SQL write')} · UI concept only · ${new Date().getFullYear()} Sohojkor</p></div>`}
function passengerScreen(){const bd=s.type==='BD';const f=s.foreign;const match=samples.find(x=>x[0]===s.bdPassport.toUpperCase());const options=samples.filter(x=>!s.passengers.some(p=>p.passport===x[0])).filter(x=>x[0].includes(s.bdPassport.toUpperCase())).slice(0,10);
let out=`<h2 class="section-title">${s.editing?T('Review passenger details'):T('Add passenger')}</h2><p class="sub">${T('Enter a passport number and search.')}</p><div class="tabs" role="tablist" aria-label="${T('Passenger type')}"><button role="tab" class="tab" aria-selected="${bd}" data-action="type" data-value="BD">⚑ &nbsp; ${T('Bangladeshi passenger')}</button><button role="tab" class="tab" aria-selected="${!bd}" data-action="type" data-value="FOREIGN">◎ &nbsp; ${T('Foreign passenger')}</button></div>`;
if(bd){out+=`<div class="passport-lookup-region"><div class="lookup">${field('bdPassport','Passport number',s.bdPassport,{required:true,placeholder:'Select or enter a sample passport',maxlength:20})}<button class="btn btn-outline" data-action="check" ${s.bdPassport.length<6?'disabled aria-disabled="true"':''}>⌕ &nbsp; ${T('Check Passport')}</button></div>`;
if(s.suggestions&&s.bdPassport.length<10)out+=`<div class="suggestions" role="listbox" aria-label="${T('Sample passport numbers')}"><div class="suggest-head">${T('Sample passport numbers')}</div>${options.map(x=>`<button class="suggest" data-action="sample" data-value="${x[0]}" role="option">${x[0]}<span>${T('Sample')}</span></button>`).join('')||`<div class="field-hint" style="padding:10px">${T('Sample passport is not available. Select a listed test passport.')}</div>`}</div>`;
out+=`</div>`;
if(s.lookup&&s.lookup.passport===s.bdPassport&&match){const p=s.lookup;out+=`<section class="info-card" aria-label="${T('Passenger details')}"><div class="card-top"><span>${T('Passenger details')}</span></div>${infoRows(p)}${medicalControl()}<div class="card-action"><button class="btn btn-outline" data-action="add">＋ &nbsp; ${T(s.editing?'Edit':'Add passenger')}</button></div></section>`}}
else{out+=`<div class="field-grid">${field('foreignPassport','Passport number',f.passport,{required:true,placeholder:'Enter passport',maxlength:20})}${field('foreignName','Passenger name',f.name,{required:true,placeholder:'Enter full name',maxlength:100})}${field('foreignDOB','Date of birth',f.dob,{required:true,type:'date',max:dateToday()})}${field('foreignCountry','Country of nationality',f.country,{required:true,placeholder:'Enter country',maxlength:80})}</div>`; const ready=f.passport.trim().length>=6&&f.name.trim().length>=2&&validDate(f.dob)&&f.dob<=dateToday()&&f.country.trim();if(ready){const p={type:'FOREIGN',passport:f.passport.trim().toUpperCase(),name:f.name.trim().toUpperCase(),dob:f.dob,country:f.country};out+=`<section class="info-card"><div class="card-top"><span>${T('Review passenger details')}</span><span class="verified">${T('Foreign')}</span></div>${infoRows(p)}<div class="field-hint">${T('Passenger information entered manually — not government verified')}</div>${medicalControl()}<div class="card-action"><button class="btn btn-outline" data-action="add">＋ &nbsp; ${T(s.editing?'Edit':'Add passenger')}</button></div></section>`}else out+=``;}
if(s.editing)out+=`<button class="alt-action" data-action="cancelEdit">${T('Back')} · ${T('Continue')}</button>`;
return out}
function medicalControl(){return `<label class="medical"><input id="medical" type="checkbox" data-field="medical" ${s.medical?'checked':''}/><span>${T('Request manual medical assessment at departure port')}</span></label>${s.medical?`<div class="notice" role="status">${T('Manual medical assessment must be completed at the departure port. This is not an automatic tax exemption. Uncheck to continue online.')}</div>`:''}`}
function travelScreen(){const chosen=s.mode==='LAND'?s.landPort:s.waterPort;let ports=s.mode==='LAND'?landPorts:waterPorts;return `<h2 class="section-title">${T('Travel Details')}</h2><p class="sub">${T('Your previous port choice is preserved when switching travel modes.')}</p><div class="field"><label>${T('Travel mode')} <span class="req">*</span></label><div class="controls"><label class="choice ${s.mode==='LAND'?'checked':''}"><input type="radio" name="mode" value="LAND" data-field="mode" ${s.mode==='LAND'?'checked':''}/><span>▤ &nbsp; ${T('By land')}</span></label><label class="choice ${s.mode==='WATER'?'checked':''}"><input type="radio" name="mode" value="WATER" data-field="mode" ${s.mode==='WATER'?'checked':''}/><span>≋ &nbsp; ${T('By water')}</span></label></div></div><div class="field-grid"><div class="field"><label for="port">${T('Departure port')} <span class="req">*</span></label><select id="port" data-field="port"><option value="">${T('Select departure port')}</option>${ports.map(p=>`<option ${chosen===p?'selected':''} value="${h(p)}">${h(p)}</option>`).join('')}</select>${s.mode==='WATER'?`<div class="field-hint">${T('Illustrative rate only')}</div>`:''}</div>${field('destination','Destination',s.destination,{required:true,placeholder:'Enter destination',maxlength:80,list:'destinations'})}<datalist id="destinations">${['India','Nepal','Bhutan','Myanmar'].map(x=>`<option value="${x}"></option>`).join('')}</datalist>${field('travelDate','Travel date',s.travelDate,{required:true,type:'date',min:dateToday()})}</div><div class="section-divider"></div><div class="inline"><div><strong style="font-size:13px">${T('Passengers in this payment')}: ${s.passengers.length}</strong><p class="field-hint">${s.passengers.map(p=>h(p.name)).join(', ')}</p></div><button class="btn btn-soft" data-action="editPassengers">✎ ${T('Edit passengers')}</button></div>${s.passengers.length&&total()!==null?`<div class="total-bar"><span>${T('Calculated total')}</span><strong>${money(total())}</strong></div>`:''}`}
function previewScreen(){const port=s.mode==='LAND'?s.landPort:s.waterPort;return `<h2 class="section-title">${T('Final Preview')}</h2><p class="sub">${T('Review passenger details')} · ${T('Illustrative rate only')}</p><div class="inline" style="margin:0 0 12px"><strong style="font-size:13px">${T('Passenger review')}</strong><button class="alt-action" data-action="editPassengers">${T('Edit passengers')}</button></div><table class="review-table"><thead><tr><th style="width:40%">${T('Passenger name')}</th><th>${T('Passport')}</th><th>${T('Age')}</th><th>${T('Tax')}</th></tr></thead><tbody>${s.passengers.map(p=>`<tr><td class="name">${h(p.name)}</td><td>${h(masked(p))}</td><td>${ageAt(p.dob,s.travelDate)}</td><td><strong>${money(amount(p)||0)}</strong></td></tr>`).join('')}</tbody></table><div class="total-bar"><span>${T('Total payable (sample)')}</span><strong>${money(total()||0)}</strong></div><div class="section-divider"></div><div class="inline" style="margin-bottom:7px"><h3 class="section-title">${T('Route summary')}</h3><button class="alt-action" data-action="editRoute">${T('Edit')}</button></div><div class="kv"><span>${T('Travel mode')}</span><strong>${T(s.mode==='LAND'?'By land':'By water')}</strong></div><div class="kv"><span>${T('Port')}</span><strong>${h(port)}</strong></div><div class="kv"><span>${T('Destination')}</span><strong>${h(s.destination)}</strong></div><div class="kv"><span>${T('Travel date')}</span><strong>${h(s.travelDate)}</strong></div><div class="section-divider"></div><h3 class="section-title">${T('Receipt contact')}</h3><p class="sub">${T('No real payment or SQL write')}</p><div class="field-grid">${field('phone','Mobile number',s.phone,{required:true,placeholder:'01700000000',maxlength:11})}${field('email','Email (optional)',s.email,{type:'email',placeholder:'example@email.com',maxlength:90})}</div>`}
function channelScreen(){const groups=[['mfs','Mobile banking'],['bank','Internet banking'],['card','Card']];const providers={mfs:['bKash','Nagad','Rocket'],bank:['Internet bank'],card:['Visa','Mastercard']};return `<h2 class="section-title">${T('Payment Channel')}</h2><p class="sub">${T('No real payment or SQL write')}</p><div class="payment-choices"><label class="pay-type ${s.channel==='NOW'?'checked':''}"><input type="radio" data-field="channel" value="NOW" name="channel" ${s.channel==='NOW'?'checked':''}/><span><strong>${T('Pay online')}</strong><small>${T('Mobile banking')} / ${T('Internet banking')} / ${T('Card')}</small></span></label><label class="pay-type ${s.channel==='OTC'?'checked':''}"><input type="radio" data-field="channel" value="OTC" name="channel" ${s.channel==='OTC'?'checked':''}/><span><strong>${T('Pay at a bank branch')}</strong><small>${T('No real payment or SQL write')}</small></span></label></div>${s.channel==='NOW'?`<div class="section-divider"></div><div class="field"><label>${T('Payment type')}</label><div class="method-grid">${groups.map(([value,label])=>`<button class="method ${s.group===value?'checked':''}" data-action="group" data-value="${value}">${T(label)}</button>`).join('')}</div></div><div class="field"><label>${T('Choose a provider')}</label><div class="methods-list">${providers[s.group].map(p=>`<button class="provider ${s.provider===p?'checked':''}" data-action="provider" data-value="${h(p)}">${h(p)}</button>`).join('')}</div></div>`:''}<label class="check-row"><input type="checkbox" data-field="ack" ${s.ack?'checked':''}/><span>${T('I understand this is a simulated prototype; no payment or official challan will be created.')}</span></label><div class="note bento-note"><span class="dotinfo">i</span><div>${T('Payments, bank settlement, receipts and SQL writes are intentionally disabled.')}</div></div>`}
function endPage(){return `<div class="done" role="status"><div class="doneicon">✓</div><h2>${T('Simulation completed')}</h2><span class="pill">${T('Sample reference only')}</span><p>${T('No payment was made. No official challan or receipt was generated.')}</p><button class="btn btn-primary" data-action="restart">${T('Restart simulation')} →</button></div>`}
function aside(){if(s.stage===0)return `<aside class="aside"><div class="aside-head">♙ &nbsp;${T('Passengers in this payment')} <span class="count">${s.passengers.length}</span></div><div class="rail">${s.passengers.length===0?`<div class="empty"><span style="font-size:25px">♙</span><strong>${T('No passengers added')}</strong></div>`:s.passengers.map((p,i)=>`<div class="rail-item"><span class="number">${i+1}</span><div class="rail-info"><strong>${h(p.name)}</strong><small>${h(p.type==='BD'?tr('Bangladeshi'):tr('Foreign'))} · ${h(masked(p))}</small><div class="rail-actions"><button class="tiny-btn" data-action="edit" data-value="${h(p.id)}">${T('Edit')}</button><button class="tiny-btn delete" data-action="remove" data-value="${h(p.id)}">${T('Remove')}</button></div></div></div>`).join('')}</div></aside>`;
const calc=total();return `<aside class="aside aside--active"><div class="aside-head">▤ &nbsp;${T('Payment calculation')} <span class="count">${s.passengers.length}</span></div><div class="calc-card"><div class="calc-label">${T('Calculated total')}</div><div class="calc-total"><strong>${calc===null?'—':money(calc)}</strong><span>${T('Illustrative rate only')}</span></div><div class="mini-divider"></div><div class="kv"><span>${T('Travel mode')}</span><strong>${T(s.mode==='LAND'?'Land':'Water')}</strong></div><div class="kv"><span>${T('Passengers')}</span><strong>${s.passengers.length}</strong></div>${calc!==null?s.passengers.map(p=>`<div class="kv"><span>${h(p.name)} (${ageAt(p.dob,s.travelDate)} ${T('Age')})</span><strong>${money(amount(p)||0)}</strong></div>`).join(''):`<div class="note">${T('Awaiting route details')}</div>`}</div></aside>`}
function footer(){let next=s.stage===0?'Continue to travel details':s.stage===1?'Continue to final preview':s.stage===2?(total()===0?'Finish no-tax review':'Choose payment method'):'View simulated result';const blocked=s.stage===0&&(s.passengers.length===0||!!s.editing);return `<footer class="footer"><button type="button" data-action="next" ${blocked?'disabled aria-disabled="true"':''}>${T(next)} &nbsp; →</button></footer>`}
function render(focus){const active=focus&&document.activeElement;const id=active?.id;const a=id&&typeof active.selectionStart==='number'?active.selectionStart:null;const b=id&&typeof active.selectionEnd==='number'?active.selectionEnd:null;$('app').innerHTML=header();document.documentElement.lang=s.lang;if(focus&&id){const el=$(id);if(el){try{el.focus({preventScroll:true});if(a!==null&&['text','tel','email','search'].includes(el.type))el.setSelectionRange(a,b)}catch(e){}}}}
function showError(err){s.error=err;render();const el=document.querySelector('[role="alert"]');el?.scrollIntoView({behavior:'smooth',block:'nearest'});}
function cleanForm(){s.type='BD';s.bdPassport='';s.lookup=null;s.medical=false;s.foreign={passport:'',name:'',dob:'',country:''};s.suggestions=false;s.editing=null;}
function addPassenger(){if(s.medical){showError('No traveler can be added with medical assessment selected.');return}
let p;if(s.type==='BD'){if(!s.lookup||s.bdPassport!==s.lookup.passport){showError('Sample passport is not available. Select a listed test passport.');return}p={...s.lookup}}else{const f=s.foreign;if(f.passport.trim().length<6){showError('A passport number needs at least 6 characters.');return}if(f.name.trim().length<2){showError('Enter the passenger name.');return}if(!validDate(f.dob)||f.dob>dateToday()){showError('Select a valid date of birth.');return}if(!f.country.trim()){showError('Enter country of nationality.');return}p={type:'FOREIGN',passport:f.passport.trim().toUpperCase(),name:f.name.trim().toUpperCase(),dob:f.dob,country:f.country.trim()}}
if(s.passengers.some(x=>x.passport===p.passport&&x.id!==s.editing)){showError('This passenger is already added.');return}p.id=s.editing||('p'+Date.now()+Math.random().toString(16).slice(2,5));if(s.editing){s.passengers=s.passengers.map(x=>x.id===s.editing?p:x)}else s.passengers.push(p);s.error='';cleanForm();render()}
function validateRoute(){if(s.passengers.length===0)return 'Enter at least one passenger before continuing.';if(!(s.mode==='LAND'?s.landPort:s.waterPort))return 'Choose a departure port.';if(!s.destination.trim())return 'Enter a destination.';if(!validDate(s.travelDate)||s.travelDate<dateToday())return 'Choose a valid travel date.';for(const p of s.passengers)if(ageAt(p.dob,s.travelDate)===null)return 'Select a valid date of birth.';return ''}
function next(){if(s.stage===0){if(!s.passengers.length)return showError('Enter at least one passenger before continuing.');if(s.editing)return showError('Complete the passenger details before adding.');s.stage=1;}else if(s.stage===1){const e=validateRoute();if(e)return showError(e);s.stage=2;}else if(s.stage===2){const e=validateRoute();if(e)return showError(e);if(total()!==0&&!/^01\d{9}$/.test(s.phone))return showError('Enter a valid 11-digit mobile number starting with 01.');s.stage=total()===0?4:3;}else if(s.stage===3){if(s.channel==='NOW'&&!s.provider)return showError('Choose a payment channel and provider.');if(!s.ack)return showError('Confirm simulation acknowledgement.');s.stage=4;}s.error='';render();window.scrollTo({top:0,behavior:'smooth'})}
function back(){if(s.stage===0){s.closed=true}else if(s.stage>0)s.stage--;s.error='';render()}
function onClick(e){const b=e.target.closest('[data-action]');if(!b)return;const a=b.dataset.action,v=b.dataset.value;if(a==='lang'){s.lang=s.lang==='en'?'bn':'en';render();return}if(a==='back')return back();if(a==='close'){s.closed=true;render();return}if(a==='reopen'||a==='restart'){const l=s.lang;Object.assign(s,{lang:l,stage:0,closed:false,type:'BD',lookup:null,bdPassport:'',foreign:{passport:'',name:'',dob:'',country:''},medical:false,suggestions:false,passengers:[],editing:null,error:'',mode:'LAND',landPort:'',waterPort:'',destination:'',travelDate:'',phone:'',email:'',channel:'NOW',group:'mfs',provider:'',ack:false});render();return}if(a==='next')return next();if(a==='type'){s.type=v;s.medical=false;s.error='';s.lookup=null;s.suggestions=false;render();return}if(a==='check'){s.suggestions=false;const q=s.bdPassport.trim().toUpperCase();if(!q)return showError('Enter a passport number first.');if(s.passengers.some(p=>p.passport===q&&p.id!==s.editing))return showError('This passenger is already added.');const match=samples.find(x=>x[0]===q);if(!match)return showError('Sample passport is not available. Select a listed test passport.');s.lookup={type:'BD',passport:match[0],name:match[1],dob:match[2],country:'Bangladesh'};s.bdPassport=match[0];s.error='';render();return}if(a==='sample'){s.bdPassport=v;s.suggestions=false;s.lookup=null;s.error='';render();$('bdPassport')?.focus();return}if(a==='add')return addPassenger();if(a==='edit'){const p=s.passengers.find(x=>x.id===v);if(!p)return;s.stage=0;s.editing=p.id;s.type=p.type;s.medical=false;s.lookup=p.type==='BD'?p:null;s.bdPassport=p.type==='BD'?p.passport:'';s.foreign=p.type==='FOREIGN'?{passport:p.passport,name:p.name,dob:p.dob,country:p.country}:{passport:'',name:'',dob:'',country:''};s.error='';render();return}if(a==='remove'){const i=s.passengers.findIndex(p=>p.id===v);if(i<0)return;s.passengers.splice(i,1);if(s.editing===v)cleanForm();s.error='';render();return}if(a==='cancelEdit'){cleanForm();s.error='';render();return}if(a==='editPassengers'){s.stage=0;s.error='';cleanForm();render();return}if(a==='editRoute'){s.stage=1;s.error='';render();return}if(a==='group'){s.group=v;s.provider='';render();return}if(a==='provider'){s.provider=v;render();return}}
function updateField(e){const el=e.target,f=el.dataset.field;if(!f)return;const val=el.type==='checkbox'?el.checked:el.value;if(f==='bdPassport'){s.bdPassport=String(val).toUpperCase().replace(/\s+/g,'');s.lookup=null;s.medical=false;s.suggestions=s.bdPassport.length<10;s.error='';render(true);return}if(f==='foreignPassport')s.foreign.passport=String(val).toUpperCase().replace(/\s+/g,'');else if(f==='foreignName')s.foreign.name=String(val).toUpperCase();else if(f==='foreignDOB')s.foreign.dob=val;else if(f==='foreignCountry')s.foreign.country=val;else if(f==='medical')s.medical=!!val;else if(f==='mode')s.mode=val;else if(f==='port'){if(s.mode==='LAND')s.landPort=val;else s.waterPort=val}else if(f==='destination')s.destination=val;else if(f==='travelDate')s.travelDate=val;else if(f==='phone')s.phone=String(val).replace(/[^0-9]/g,'').slice(0,11);else if(f==='email')s.email=val;else if(f==='channel'){s.channel=val;s.provider='';s.ack=false}else if(f==='ack')s.ack=!!val;s.error='';render(el.type!=='radio'&&el.type!=='checkbox'&&el.tagName!=='SELECT'&&el.type!=='date')}
$('app')?.addEventListener('click',onClick);document.addEventListener('input',e=>{const f=e.target?.dataset?.field;if(f&&(!['medical','mode','port','travelDate','channel','ack'].includes(f)))updateField(e)});document.addEventListener('change',e=>{const f=e.target?.dataset?.field;if(f&&(['medical','mode','port','travelDate','channel','ack','foreignDOB'].includes(f)))updateField(e)});document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!s.closed){if(s.suggestions){s.suggestions=false;render();return}s.closed=true;render()}});
render();
})();
</script>
</body>
