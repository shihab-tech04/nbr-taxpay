name: Pre-PR248 complete recovery bundle
on:
  push:
    branches: [backup/taxpay-before-pr248-20261026]
permissions:
  contents: read
jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Bundle, checksum and isolated restore test
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin '+refs/heads/*:refs/remotes/origin/*' --tags --prune
          test "$(git rev-parse refs/remotes/origin/main)" = "bdfb4403b9c01f5c064fe47762e155f9529186c1"
          git bundle create taxpay-before-pr248.bundle --all
          git bundle verify taxpay-before-pr248.bundle
          mkdir restore
          git -C restore init
          git -C restore fetch ../taxpay-before-pr248.bundle '+refs/*:refs/*'
          test "$(git -C restore rev-parse refs/remotes/origin/main)" = "bdfb4403b9c01f5c064fe47762e155f9529186c1"
          git -C restore fsck --full --no-reflogs
          sha256sum taxpay-before-pr248.bundle > taxpay-before-pr248.bundle.sha256
          sha256sum -c taxpay-before-pr248.bundle.sha256
          printf '%s\n' "Restore verified: pre-release main bdfb4403b9c01f5c064fe47762e155f9529186c1" > recovery.txt
      - uses: actions/upload-artifact@v4
        with:
          name: taxpay-before-pr248-full-git-recovery
          path: |
            taxpay-before-pr248.bundle
            taxpay-before-pr248.bundle.sha256
            recovery.txt
          if-no-files-found: error
