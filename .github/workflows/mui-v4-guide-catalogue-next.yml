name: MUI v4 next guide and catalogue controls
on:
  push:
    branches: [ops/mui-v4-guide-catalogue-next-766f320]
permissions:
  contents: read
  actions: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CI: 'true'
      VITE_SUPABASE_DISABLED: 'true'
      VITE_SUPABASE_URL: ''
      VITE_SUPABASE_PUBLISHABLE_KEY: ''
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
      - uses: actions/download-artifact@v4
        with:
          name: mui-v4-glossary-pilot-evidence
          run-id: 45657043479
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/prior-mui-pilot
      - run: |
          cp "$RUNNER_TEMP/prior-mui-pilot/package.json" package.json
          cp "$RUNNER_TEMP/prior-mui-pilot/package-lock.json" package-lock.json
          npm ci --no-audit --no-fund
          npm run lint
          npm run build
      - run: npx playwright install chromium
      - name: Verify new controls and existing guide/catalogue journeys
        run: |
          npx playwright test tests/e2e/mui-v4-guide-catalogue.spec.ts tests/e2e/head-catalogue.spec.ts --grep 'MUI |original 170-head|search is exact-source|seven source group|mobile-first content|catalogue main content|legacy source codes|read-only offline fallback|catalogue explicitly blocks' --workers=2
          npx playwright test tests/e2e/public-guest-guide.spec.ts --grep 'guide|glossary' --grep-invert 'receipt|homepage|travel payment|walk-in|payment result' --workers=2
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mui-v4-guide-catalogue-test-evidence
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
          retention-days: 7
