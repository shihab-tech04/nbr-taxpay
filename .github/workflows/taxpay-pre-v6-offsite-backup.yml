name: TaxPay pre-v6 independent recovery bundle
on:
  push:
    branches:
      - backup/taxpay-full-history-pre-v6-20261025
permissions:
  contents: read
jobs:
  backup-main:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout with complete history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Bundle authoritative main and independently restore
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin +refs/heads/main:refs/heads/main
          MAIN=$(git rev-parse refs/heads/main)
          mkdir -p "$RUNNER_TEMP/taxpay-release-backup"
          printf '%s\n' "$MAIN" > "$RUNNER_TEMP/taxpay-release-backup/main.sha"
          git bundle create "$RUNNER_TEMP/taxpay-release-backup/taxpay-full-history.bundle" refs/heads/main
          git bundle verify "$RUNNER_TEMP/taxpay-release-backup/taxpay-full-history.bundle" > "$RUNNER_TEMP/taxpay-release-backup/bundle-verify.txt" 2>&1
          git clone --mirror "$RUNNER_TEMP/taxpay-release-backup/taxpay-full-history.bundle" "$RUNNER_TEMP/taxpay-recovery.git"
          git -C "$RUNNER_TEMP/taxpay-recovery.git" fsck --full --no-reflogs > "$RUNNER_TEMP/taxpay-release-backup/fsck.txt" 2>&1
          RESTORED=$(git -C "$RUNNER_TEMP/taxpay-recovery.git" rev-parse refs/heads/main)
          test "$RESTORED" = "$MAIN"
          echo "main=$MAIN" > "$RUNNER_TEMP/taxpay-release-backup/RESTORE_RESULT.txt"
          echo "restored_main=$RESTORED" >> "$RUNNER_TEMP/taxpay-release-backup/RESTORE_RESULT.txt"
          echo "checksum=verified" >> "$RUNNER_TEMP/taxpay-release-backup/RESTORE_RESULT.txt"
          echo "fsck=PASS" >> "$RUNNER_TEMP/taxpay-release-backup/RESTORE_RESULT.txt"
          (cd "$RUNNER_TEMP/taxpay-release-backup" && sha256sum taxpay-full-history.bundle > SHA256SUMS)
          cp "$RUNNER_TEMP/taxpay-release-backup/RESTORE_RESULT.txt" "$GITHUB_STEP_SUMMARY"
      - name: Upload independent recovery artifact
        uses: actions/upload-artifact@v4
        with:
          name: taxpay-main-restorable-full-git-pre-v6
          path: ${{ runner.temp }}/taxpay-release-backup/
          retention-days: 14
          if-no-files-found: error
