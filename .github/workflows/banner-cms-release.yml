name: TaxPay content CMS release

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/banner-cms-release.yml'
      - 'src/components/layout/SiteLogo.tsx'
      - 'src/components/layout/PublicHomeHeader.tsx'
      - 'src/components/layout/CitizenFooter.tsx'
      - 'src/components/layout/CitizenNavigation.tsx'
      - 'src/components/layout/TaxpayerReferenceRail.tsx'
      - 'src/components/screens/PublicHeroCarousel.tsx'
      - 'src/components/screens/PublicReport.tsx'
      - 'src/components/screens/User1DemoExperience.tsx'
      - 'src/components/screens/GuestPayment.tsx'
      - 'src/components/screens/TravelTax.tsx'
      - 'src/components/ui/PaymentMethodSelector.tsx'
      - 'src/components/ui/PaymentJourneyFooter.tsx'
      - 'src/styles/taxpay-service-choice.css'
      - 'src/styles/taxpay-citizen.css'
      - 'src/styles/taxpay-taxpayer-reference.css'
      - 'supabase/migrations/*banner*.sql'
      - 'supabase/migrations/*site_logo*.sql'
  workflow_dispatch:

permissions:
  contents: read


concurrency:
  group: taxpay-content-cms-validation
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    # The canonical pages.yml workflow is the sole production publisher.
    # This job validates CMS assets only, avoiding competing Pages deployments.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm run test:domain
      - name: Build live SQL-backed TaxPay
        env:
          GITHUB_PAGES: 'true'
          VITE_SUPABASE_DISABLED: 'false'
          VITE_SUPABASE_URL: 'https://eyqhoavnitkrajvyqvxn.supabase.co'
          VITE_SUPABASE_PUBLISHABLE_KEY: 'sb_publishable_ZRyWCWCOWBmsg7b9qTseUg_CFlhl3Id'
        run: npm run build
      - name: Confirm both content clients are built
        run: |
          test -s dist/index.html
          grep -RFq 'taxpay_site_banners' dist/assets
          grep -RFq 'taxpay_site_logo' dist/assets
