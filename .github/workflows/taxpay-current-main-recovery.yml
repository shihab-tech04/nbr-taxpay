name: TaxPay pre-single-head UI release recovery b6f0caa
on:
  push:
    branches:
      - backup/taxpay-current-main-20261024
permissions:
  contents: read
jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch complete repository history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Create, checksum, and independently restore exact-main Git bundle
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin '+refs/heads/*:refs/remotes/origin/*' --tags --prune
          test "$(git rev-parse refs/remotes/origin/main)" = "b6f0caa814dd0aa2c5a701f9638eeebfbeaa82b5"
          git bundle create taxpay-current-main-all-refs.bundle --all
          git bundle verify taxpay-current-main-all-refs.bundle
          mkdir -p recovered
          git -C recovered init
          git -C recovered fetch ../taxpay-current-main-all-refs.bundle '+refs/*:refs/*'
          git -C recovered fsck --full --no-reflogs
          test "$(git -C recovered rev-parse refs/remotes/origin/main)" = "b6f0caa814dd0aa2c5a701f9638eeebfbeaa82b5"
          sha256sum taxpay-current-main-all-refs.bundle > taxpay-current-main-all-refs.bundle.sha256
          sha256sum -c taxpay-current-main-all-refs.bundle.sha256
          printf 'Verified original main: %s\nRestore: git fetch taxpay-current-main-all-refs.bundle refs/remotes/origin/main:refs/heads/main\n' "b6f0caa814dd0aa2c5a701f9638eeebfbeaa82b5" > recovery-instructions.txt
      - name: Preserve complete bundle, checksum and recovery instructions
        uses: actions/upload-artifact@v4
        with:
          name: taxpay-current-main-recovery-20261024
          path: |
            taxpay-current-main-all-refs.bundle
            taxpay-current-main-all-refs.bundle.sha256
            recovery-instructions.txt
          if-no-files-found: error
