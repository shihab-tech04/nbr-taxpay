name: TaxPay - build and GitHub Pages

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: taxpay-pages-${{ github.ref }}
  # Replace only superseded PR previews. Never interrupt a main-branch production release.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:

  preflight:
    name: Verified PR and immutable build provenance
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
      checks: read
      pull-requests: read
    outputs:
      mode: ${{ steps.probe.outputs.mode }}
      head: ${{ steps.probe.outputs.head }}
      tree: ${{ steps.probe.outputs.tree }}
      run: ${{ steps.probe.outputs.run }}
      artifact: ${{ steps.probe.outputs.artifact }}
    steps:
      - name: Inspect current release source and merge parents
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check verifier regression cases
        run: node --test scripts/ci/verified-merge-release.test.mjs
      - name: Confirm exact-source PR acceptance and review artifact
        id: probe
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/ci/verified-merge-release.mjs

  # Compile and browser acceptance execute independently. The original named
  # required gate still blocks Pages until every original test has passed.
  compile:
    name: Compile, typecheck, domain and production bundle
    needs: preflight
    if: needs.preflight.outputs.mode != 'reuse'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: read
      pages: read
    steps:
      - name: Check out source
        uses: actions/checkout@v7
      - name: Set up Node.js 24.21.0
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Verify TypeScript and domain constraints
        run: |
          npm run lint
          npm run test:domain
      - name: Restore Playwright headless browser cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: taxpay-pw-shell-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-v1
      - name: Install Chromium for public-preview checks
        run: npx playwright install --with-deps chromium --only-shell
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6
      - name: Compile public review-only application with scoped hosted Auth / RLS
        env:
          GITHUB_PAGES: 'true'
          VITE_SUPABASE_DISABLED: 'false'
          VITE_SUPABASE_URL: 'https://eyqhoavnitkrajvyqvxn.supabase.co'
          # Publishable key only. NEVER use service_role, secret or JWT signing keys in a web bundle.
          VITE_SUPABASE_PUBLISHABLE_KEY: 'sb_publishable_ZRyWCWCOWBmsg7b9qTseUg_CFlhl3Id'
        run: npm run build
      - name: Verify Pages base, scoped public endpoint and financial safety
        shell: bash
        run: |
          test -s dist/index.html
          grep -q '/nbr-taxpay/assets/' dist/index.html
          ! grep -q '/NBR-Tax-Payment/assets/' dist/index.html
          ! grep -q '/src/main.tsx' dist/index.html
          grep -RFq 'https://eyqhoavnitkrajvyqvxn.supabase.co' dist/assets
          # Ensure no unrelated hosted Supabase projects or privileged key formats leak.
          ! grep -REq 'sb_secret_|service_role' dist/assets
          ! grep -REq '(^|[^0-9])[0-9]{12}([^0-9]|$)' dist/assets
          ! grep -REq '(^|[^0-9])[0-9]{17}([^0-9]|$)' dist/assets
          ! grep -REq '\+?880[0-9 ()-]{8,}' dist/assets
          find dist/assets -type f -name '*.js' -size +0c | grep -q .
          echo 'PASS: public Pages build has approved publishable-only review endpoint; no privileged key shipped'
      - name: Verify actual production bundle blocks unauthenticated taxpayer/sample routes
        run: npx playwright test --config playwright.production.config.ts
      - name: Stamp reviewed PR bundle provenance
        if: github.event_name == 'pull_request'
        env:
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          set -euo pipefail
          printf '{"prHead":"%s","sourceTree":"%s"}\n' "$PR_HEAD" "$(git rev-parse 'HEAD^{tree}')" > dist/taxpay-reviewed-provenance.json
      - name: Retain immutable tested bundle for exact-source Main deployment
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: taxpay-reviewed-dist-${{ github.event.pull_request.head.sha }}
          path: dist/
          retention-days: 7
          compression-level: 0
          if-no-files-found: error
      - name: Upload Pages artifact (main only)
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

