name: TaxPay - build and GitHub Pages

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: taxpay-pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build and verify static preview
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Node.js 24.21.0
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Verify TypeScript and domain constraints
        run: |
          npm run lint
          npm run test:domain

      - name: Install Chromium for public-preview checks
        run: npx playwright install --with-deps chromium

      - name: Check public routes and disconnected backend state
        env:
          VITE_SUPABASE_DISABLED: 'true'
          VITE_SUPABASE_URL: ''
          VITE_SUPABASE_PUBLISHABLE_KEY: ''
        run: npx playwright test tests/e2e/public-financial-safety.spec.ts tests/e2e/public-backend-disabled.spec.ts

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Compile static application without backend configuration
        env:
          GITHUB_PAGES: 'true'
          VITE_SUPABASE_DISABLED: 'true'
          VITE_SUPABASE_URL: ''
          VITE_SUPABASE_PUBLISHABLE_KEY: ''
        run: npm run build

      - name: Verify Pages base and backend isolation
        shell: bash
        run: |
          test -s dist/index.html
          grep -q '/nbr-taxpay/assets/' dist/index.html
          ! grep -q '/NBR-Tax-Payment/assets/' dist/index.html
          ! grep -q '/src/main.tsx' dist/index.html
          ! grep -REq 'https://[[:alnum:]-]+\.supabase\.co' dist/assets
          ! grep -REq '(^|[^0-9])[0-9]{12}([^0-9]|$)' dist/assets
          ! grep -REq '(^|[^0-9])[0-9]{17}([^0-9]|$)' dist/assets
          ! grep -REq '\+?880[0-9 ()-]{8,}' dist/assets
          find dist/assets -type f -name '*.js' -size +0c | grep -q .
          echo 'PASS: Pages base is /nbr-taxpay/ and no hosted Supabase endpoint is bundled'

      - name: Upload Pages artifact (main only)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    name: Publish verified static build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - name: Deploy compiled application
        id: deployment
        uses: actions/deploy-pages@v5.0.1
