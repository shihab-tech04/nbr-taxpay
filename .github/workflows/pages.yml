        with:
          path: ~/.cache/ms-playwright
          key: taxpay-pw-shell-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-v1
      - name: Install Chromium for public-preview checks
        run: npx playwright install --with-deps chromium --only-shell
      - name: Check public routes and disconnected backend state
        env:
          VITE_SUPABASE_DISABLED: 'true'
          VITE_SUPABASE_URL: ''
          VITE_SUPABASE_PUBLISHABLE_KEY: ''
        run: npx playwright test tests/e2e/payment-wizard-clarity-and-grouped-totals.spec.ts tests/e2e/amar-kor-brand.spec.ts tests/e2e/citizen-design-tokens.spec.ts tests/e2e/public-hero-carousel.spec.ts tests/e2e/public-search-discovery.spec.ts tests/e2e/office-login-entry.spec.ts tests/e2e/public-financial-safety.spec.ts tests/e2e/public-backend-disabled.spec.ts tests/e2e/citizen-navigation.spec.ts tests/e2e/citizen-page-matrix.spec.ts tests/e2e/citizen-closure.spec.ts tests/e2e/citizen-keyboard-comprehensive.spec.ts tests/e2e/explore-payment-flow.spec.ts tests/e2e/taxpayer-reference-design.spec.ts tests/e2e/taxpayer-account-center.spec.ts tests/e2e/ux-writing.spec.ts tests/e2e/demo-login-scenarios.spec.ts tests/e2e/manage-authorization-desktop.spec.ts tests/e2e/taxpayer-auth-search-ux-regression.spec.ts tests/e2e/payment-review-release.spec.ts tests/e2e/payment-service-choice.spec.ts tests/e2e/pay-tax-entry-spacing.spec.ts tests/e2e/taxpay-modal-reference-parity.spec.ts tests/e2e/payment-login-resume.spec.ts tests/e2e/payment-form-step2.spec.ts tests/e2e/payment-step3-lifecycle.spec.ts tests/e2e/public-guest-guide.spec.ts tests/e2e/user1-scenario.spec.ts tests/e2e/user1-dashboard-ux-cleanup.spec.ts tests/e2e/taxpayer-dashboard-historical-reference.spec.ts tests/e2e/user1-dashboard-financial-ux.spec.ts tests/e2e/dashboard-v11-journey-month.spec.ts tests/e2e/taxpayer-transaction-rows.spec.ts tests/e2e/taxpayer-layout-1150.spec.ts tests/e2e/citizen-copy-cleanup.spec.ts tests/e2e/navigation-integrity.spec.ts tests/e2e/taxpayer-account-integrity.spec.ts tests/e2e/taxpayer-visible-entry.spec.ts tests/e2e/inapp-simulation-notification.spec.ts --shard=${{ matrix.shard }}/6

  reuse-reviewed-build:
    name: Reuse exact-source verified PR bundle
    needs: preflight
    if: needs.preflight.outputs.mode == 'reuse'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: read
      actions: read
      pages: read
    steps:
      - name: Download immutable artifact from accepted exact-head PR workflow
        uses: actions/download-artifact@v4
        with:
          name: taxpay-reviewed-dist-${{ needs.preflight.outputs.head }}
          repository: ${{ github.repository }}
          run-id: ${{ needs.preflight.outputs.run }}
          github-token: ${{ github.token }}
          path: dist/
      - name: Match artifact provenance to merged source tree and preserve release safety
        env:
          EXPECTED_HEAD: ${{ needs.preflight.outputs.head }}
          EXPECTED_TREE: ${{ needs.preflight.outputs.tree }}
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import {readFileSync} from 'node:fs';
          import assert from 'node:assert/strict';
          const proof=JSON.parse(readFileSync('dist/taxpay-reviewed-provenance.json','utf8'));
          assert.deepEqual(proof,{prHead:process.env.EXPECTED_HEAD,sourceTree:process.env.EXPECTED_TREE});
          console.log('PASS: immutable PR build tree equals production merge tree');
          NODE
          test -s dist/index.html
          grep -q '/nbr-taxpay/assets/' dist/index.html
          ! grep -q '/NBR-Tax-Payment/assets/' dist/index.html
          ! grep -q '/src/main.tsx' dist/index.html
          grep -RFq 'https://eyqhoavnitkrajvyqvxn.supabase.co' dist/assets
          ! grep -REq 'sb_secret_|service_role' dist/assets
          ! grep -REq '(^|[^0-9])[0-9]{12}([^0-9]|$)' dist/assets
          ! grep -REq '(^|[^0-9])[0-9]{17}([^0-9]|$)' dist/assets
          ! grep -REq '\+?880[0-9 ()-]{8,}' dist/assets
          find dist/assets -type f -name '*.js' -size +0c | grep -q .
          rm dist/taxpay-reviewed-provenance.json
          echo 'PASS: reviewed artifact safety and exact tree verified'
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6
      - name: Upload exact-source reviewed Pages bundle
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist/

  verification-gate:
    name: Build and verify static preview
    if: always()
    needs: [preflight, compile, core-e2e, core-beneficiary-e2e, core-cms-e2e, payment-ux-e2e, payment-progress-e2e, public-e2e, public-login-e2e, beneficiary-picker-e2e, public-support-e2e, route-e2e, reuse-reviewed-build]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Confirm mandatory check paths, including reused verified PR evidence
        shell: bash
        env:
          PREFLIGHT: ${{ needs.preflight.result }}
          MODE: ${{ needs.preflight.outputs.mode }}
          COMPILE: ${{ needs.compile.result }}
          CORE: ${{ needs.core-e2e.result }}
          BENEFICIARY: ${{ needs.core-beneficiary-e2e.result }}
          CMS: ${{ needs.core-cms-e2e.result }}
          PAYMENT: ${{ needs.payment-ux-e2e.result }}
          PROGRESS: ${{ needs.payment-progress-e2e.result }}
          PUBLIC: ${{ needs.public-e2e.result }}
          PUBLIC_LOGIN: ${{ needs.public-login-e2e.result }}
          PICKER: ${{ needs.beneficiary-picker-e2e.result }}
          SUPPORT: ${{ needs.public-support-e2e.result }}
          ROUTES: ${{ needs.route-e2e.result }}
          REUSED: ${{ needs.reuse-reviewed-build.result }}
        run: |
          set -euo pipefail
          test "$PREFLIGHT" = success
          case "$MODE" in
            full)
              test "$REUSED" = skipped
              for result in "$COMPILE" "$CORE" "$BENEFICIARY" "$CMS" "$PAYMENT" "$PROGRESS" "$PUBLIC" "$PUBLIC_LOGIN" "$PICKER" "$SUPPORT" "$ROUTES"; do
                test "$result" = success
              done
              echo 'PASS: every independent live-build and browser acceptance lane passed'
              ;;
            reuse)
              test "$REUSED" = success
              for result in "$COMPILE" "$CORE" "$BENEFICIARY" "$CMS" "$PAYMENT" "$PROGRESS" "$PUBLIC" "$PUBLIC_LOGIN" "$PICKER" "$SUPPORT" "$ROUTES"; do
                test "$result" = skipped
              done
              echo 'PASS: byte-identical artifact from fully verified PR, without retesting unchanged source'
              ;;
            *)
              echo "FAIL: unrecognized verified release mode" >&2
              exit 1
              ;;
          esac


  deploy:
    name: Publish verified static build
    if: always() && needs.verification-gate.result == 'success' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    needs: verification-gate
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - name: Deploy compiled application
        id: deployment
        uses: actions/deploy-pages@v5.0.1

      - name: Read back published Pages HTML
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        shell: bash
        run: |
          test -n "$PAGE_URL"
          echo "Read-back target: $PAGE_URL"
          for attempt in {1..12}; do
            if curl --fail --silent --show-error --location --max-time 20 "$PAGE_URL" -o /tmp/taxpay-live.html &&
               grep -Fq 'করবৃত্ত | Korbritto — Income Tax Payment Information' /tmp/taxpay-live.html &&
               grep -q '/nbr-taxpay/assets/' /tmp/taxpay-live.html; then
              echo "PASS: public Pages HTML and asset prefix read back from $PAGE_URL"
              PREVIEW_URL="${PAGE_URL%/}/taxpayer-dashboard-preview.html"
              if curl --fail --silent --show-error --location --max-time 20 "$PREVIEW_URL" -o /tmp/taxpay-preview-live.html &&
                 grep -q 'Taxpayer dashboard' /tmp/taxpay-preview-live.html &&
                 grep -q 'View empty state' /tmp/taxpay-preview-live.html &&
                 grep -q 'DESIGN PREVIEW' /tmp/taxpay-preview-live.html; then
                echo "PASS: taxpayer preview public HTML read-back: $PREVIEW_URL"
                exit 0
              fi
              echo "FAIL: taxpayer dashboard preview not published or content mismatch" >&2
              exit 1
            fi
            echo "Pages content not yet ready (attempt $attempt of 12)"
            sleep 10
          done
          echo "FAIL: public Pages HTML could not be verified" >&2
          exit 1

      - name: Check out source for deployed signed-out browser verification
        uses: actions/checkout@v7

      - name: Set up Node.js for deployed browser verification
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm

      - name: Restore deployed browser cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: taxpay-pw-shell-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-v1
      - name: Install deployed browser verification dependencies
        run: |
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium --only-shell

      - name: Verify deployed private-route authentication boundary in Chromium
        env:
          TAXPAY_LIVE_URL: ${{ steps.deployment.outputs.page_url }}
          TAXPAY_REQUIRE_BENEFICIARIES_MODAL: '1'
        run: node scripts/verify-live-public-auth.mjs

      - name: Verify deployed public record search and sample lookup in Chromium
        env:
          TAXPAY_LIVE_URL: ${{ steps.deployment.outputs.page_url }}
        run: node scripts/verify-live-public-search.mjs

      - name: Verify deployed Travel Tax progressive passport journey on desktop and mobile
        env:
          TAXPAY_LIVE_URL: ${{ steps.deployment.outputs.page_url }}
        run: node scripts/verify-live-travel-passport.mjs

      - name: Verify live Convay-style Transactions table with the existing User ID journey
        env:
          TAXPAY_LIVE_URL: ${{ steps.deployment.outputs.page_url }}
        run: node scripts/verify-live-table.mjs

      - name: Upload live signed-out browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: taxpay-live-auth-browser-evidence
          path: |
            test-results/live-auth-*.png
            test-results/live-search-*.png
            test-results/live-travel-passport-*.png
            test-results/live-table-*.png
          if-no-files-found: ignore
