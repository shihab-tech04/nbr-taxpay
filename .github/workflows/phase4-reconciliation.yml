name: Phase 4 - field-level SQL reconciliation contract
on:
  pull_request:
    paths:
      - 'scripts/ci/phase4-reconcile*.mjs'
      - 'scripts/ci/phase4-bridge-readiness*.mjs'
      - 'scripts/ci/phase4-threeway*.mjs'
      - '.github/workflows/phase4-reconciliation.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/ci/phase4-reconcile*.mjs'
      - 'scripts/ci/phase4-bridge-readiness*.mjs'
      - 'scripts/ci/phase4-threeway*.mjs'
      - '.github/workflows/phase4-reconciliation.yml'
permissions:
  contents: read
jobs:
  immutable-payment-parity:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Reject invented payment or Office SQL readiness
        run: |
          node --test scripts/ci/phase4-reconcile.test.mjs
          node --test scripts/ci/phase4-bridge-readiness.test.mjs
          node --test scripts/ci/phase4-threeway.test.mjs
