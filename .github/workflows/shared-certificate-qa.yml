name: Shared Certificate Browser Acceptance
on:
  pull_request:
    paths:
      - 'src/services/confirmedPaymentCertificate.ts'
      - 'src/services/receiptDocumentExport.ts'
      - 'src/components/screens/PaymentDetailView.tsx'
      - 'src/components/screens/GuestPayment.tsx'
      - 'src/components/common/ReceiptView.tsx'
      - 'src/types/tax.ts'
      - 'src/styles/taxpay-citizen.css'
      - 'tests/e2e/taxpayer-allocation-certificate.spec.ts'
      - 'src/services/routeContract.ts'
      - 'tests/e2e/shared-certificate.spec.ts'
      - 'src/components/common/PaymentCertificateDocument.tsx'
      - 'src/services/paymentCertificateModel.ts'
      - 'tests/paymentCertificateModel.test.ts'
      - 'tests/e2e/travel-tax-payment-certificate.spec.ts'
      - '.github/workflows/shared-certificate-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  certificate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '24',cache: npm}
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install chromium
      - run: npm run lint
      - run: node --import tsx --test tests/certificate-parity.test.ts tests/paymentCertificateModel.test.ts
      - run: npx playwright test tests/e2e/shared-certificate.spec.ts --project=desktop-1280
      - name: Verify allocation certificates at phone and desktop widths in English and Bengali
        run: npx playwright test tests/e2e/taxpayer-allocation-certificate.spec.ts --project=mobile-320 --project=mobile-375 --project=desktop-1280
      - name: Verify Travel Tax certificates in English and Bengali with an isolated payment acknowledgement
        env:
          VITE_SUPABASE_DISABLED: 'false'
          VITE_SUPABASE_URL: 'https://travel-certificate-fixture.invalid'
          VITE_SUPABASE_PUBLISHABLE_KEY: 'fixture-only-publishable-key'
        run: npx playwright test tests/e2e/travel-tax-payment-certificate.spec.ts --project=mobile-320 --project=desktop-1280
