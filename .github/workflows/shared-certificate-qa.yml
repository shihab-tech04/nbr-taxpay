name: Shared Certificate Browser Acceptance
on:
  pull_request:
    paths:
      - 'src/services/confirmedPaymentCertificate.ts'
      - 'src/services/receiptDocumentExport.ts'
      - 'src/components/screens/PaymentDetailView.tsx'
      - 'src/components/common/ReceiptView.tsx'
      - 'src/services/routeContract.ts'
      - 'tests/e2e/shared-certificate.spec.ts'
      - '.github/workflows/shared-certificate-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  certificate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '24',cache: npm}
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: npm run lint
      - run: node --import tsx --test tests/certificate-parity.test.ts
      - run: npx playwright test tests/e2e/shared-certificate.spec.ts --project=desktop-1280
