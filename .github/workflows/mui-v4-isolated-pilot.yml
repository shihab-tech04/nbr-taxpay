name: MUI v4 isolated glossary pilot
on:
  push:
    branches: [ops/mui-v4-pilot-build-bb3fcb77]
permissions:
  contents: write
jobs:
  pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI: 'true'
      VITE_SUPABASE_DISABLED: 'true'
      VITE_SUPABASE_URL: ''
      VITE_SUPABASE_PUBLISHABLE_KEY: ''
      BASE_SHA: bb3fcb774695350e93f00d3fd3c27fadbac56ee0
      FOUNDATION_SHA: 1619a8951c4b0b1ed6e1d70f868c6aff8d343d84
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify exact protected recovery and source boundaries
        shell: bash
        run: |
          set -euo pipefail
          test "$(git ls-remote origin refs/tags/recovery/mui-v4-bb3fcb77 | cut -f1)" = "$BASE_SHA"
          git merge-base --is-ancestor "$BASE_SHA" HEAD
          git merge-base --is-ancestor "$FOUNDATION_SHA" HEAD
          git diff --name-only "$BASE_SHA" HEAD
          test -z "$(git diff "$BASE_SHA" HEAD -- src/App.tsx src/index.css src/styles src/components/layout src/services supabase src/components/screens/PublicLanding.tsx src/components/screens/Home2Layout.tsx src/components/screens/home2 src/components/screens/home3 src/components/screens/PublicHeroCarousel.tsx)"
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
      - name: Install pinned free MUI and verify package metadata
        shell: bash
        run: |
          set -euo pipefail
          npm install --save-exact @mui/material@7.3.11 @emotion/react@11.14.0 @emotion/styled@11.14.1 --no-audit --no-fund
          node --input-type=commonjs <<'JS'
          const fs=require('fs'), assert=require('assert/strict'), child=require('child_process');
          const before=JSON.parse(child.execFileSync('git',['show',process.env.BASE_SHA+':package.json']));
          const after=require('./package.json');
          const added={'@mui/material':'7.3.11','@emotion/react':'11.14.0','@emotion/styled':'11.14.1'};
          assert.deepEqual(after.dependencies,{...before.dependencies,...added});
          assert.deepEqual(after.devDependencies,before.devDependencies);
          for(const [name,version] of Object.entries(added)){
            const pkg=JSON.parse(fs.readFileSync('node_modules/'+name+'/package.json','utf8'));
            assert.equal(pkg.version,version); assert.equal(pkg.license,'MIT');
            console.log(name,pkg.version,pkg.license);
          }
          JS
          npm ci --no-audit --no-fund
      - name: Typecheck, existing domain tests and build
        run: |
          npm run lint
          npm run test:domain
          npm run build
          du -sb dist
      - run: npx playwright install chromium
      - name: Test actual glossary interactions and protected home routes
        run: npx playwright test tests/e2e/public-guidance-p3.spec.ts tests/e2e/public-guest-guide.spec.ts tests/e2e/mui-v4-glossary-pilot.spec.ts --grep 'glossary|MUI pilot|MUI glossary' --workers=2
      - name: Preserve exact candidate for authorized protected PR review
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/mui-v4-isolated-pilot.yml
          git add package.json package-lock.json
          git -c user.name='Sohojkor recovery runner' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Pin MUI dependencies and remove isolated runner workflow'
          mkdir -p pilot-evidence
          git diff --binary "$BASE_SHA" HEAD > pilot-evidence/candidate.patch
          git rev-parse HEAD > pilot-evidence/CANDIDATE_SHA
          git rev-parse HEAD^{tree} > pilot-evidence/CANDIDATE_TREE
          git diff --name-only "$BASE_SHA" HEAD > pilot-evidence/CHANGED_FILES
          cp package.json package-lock.json pilot-evidence/
          git bundle create pilot-evidence/candidate.bundle HEAD
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mui-v4-glossary-pilot-evidence
          path: |
            pilot-evidence/
            test-results/
            playwright-report/
            package.json
            package-lock.json
          if-no-files-found: error
          retention-days: 7
      - name: Publish tested candidate branch only (not Main, no deployment)
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$BASE_SHA"
          test "$(git ls-remote origin refs/heads/ux/sohojkor-ui-library-foundation-20261124 | cut -f1)" = "$FOUNDATION_SHA"
          gh auth setup-git
          git push origin HEAD:refs/heads/ops/mui-v4-tested-candidate-bb3fcb77
          test "$(git ls-remote origin refs/heads/ops/mui-v4-tested-candidate-bb3fcb77 | cut -f1)" = "$(git rev-parse HEAD)"
