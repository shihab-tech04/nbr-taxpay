name: TaxPay public Storage binary recovery
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/taxpay-storage-binary-recovery.yml'
  push:
    branches: [security/handoff-office-auth-gate-20261110]
    paths:
      - '.github/workflows/taxpay-storage-binary-recovery.yml'
      - '.github/recovery/taxpay-storage-integrity-manifest.json'
permissions:
  contents: read
jobs:
  verify-and-export-public-storage:
    strategy:
      fail-fast: false
      matrix:
        project_id: [eyqhoavnitkrajvyqvxn, gmuhitmaynfhipcvbvkh]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout approved repository source
        uses: actions/checkout@v4
      - name: Download, checksum and offline-restore actual public Storage bytes in selected project
        env:
          PROJECT_ID: ${{ matrix.project_id }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json, pathlib, shutil, tarfile, urllib.request, urllib.parse, urllib.error, time, os, sys
          manifest=json.load(open('.github/recovery/taxpay-storage-integrity-manifest.json'))
          assert manifest['sourceProjectId']=='eyqhoavnitkrajvyqvxn'
          assert len(manifest['objects'])==21 and manifest['totalBytes']==24474931
          project=os.environ['PROJECT_ID']
assert project in ('eyqhoavnitkrajvyqvxn','gmuhitmaynfhipcvbvkh')
projects=(project,)
          root=pathlib.Path('storage-export')
          live=root/'source-storage'
          live.mkdir(parents=True,exist_ok=True)
          verified=[]
          for project in projects:
              for obj in manifest['objects']:
                  bucket,path=obj['bucket'],obj['path']
                  assert bucket in ('taxpay-banners','taxpay-branding')
                  assert path and not pathlib.PurePosixPath(path).is_absolute()
                  assert '..' not in pathlib.PurePosixPath(path).parts
                  url=('https://'+project+'.supabase.co/storage/v1/object/public/'
                       +urllib.parse.quote(bucket,safe='')+'/'
                       +urllib.parse.quote(path,safe='/'))
                  content=None
                  for attempt in range(3):
                      try:
                          req=urllib.request.Request(url,headers={'User-Agent':'Sohojkor-WS5-public-storage-recovery/1.0'})
                          with urllib.request.urlopen(req,timeout=60) as response:
                              assert response.status==200
                              content=response.read(5242881)
                          break
                      except urllib.error.HTTPError as exc:
                diagnostic=exc.read(800).decode('utf-8','replace')
                print(f'SUPABASE_STORAGE_HTTP_ERROR project={project} status={exc.code} detail={diagnostic}',file=sys.stderr)
                if exc.code not in (408,429,500,502,503,504) or attempt==2: raise
                time.sleep(attempt+1)
            except (TimeoutError, OSError):
                          if attempt==2: raise
                          time.sleep(attempt+1)
                  assert content is not None
                  assert len(content)==obj['bytes'],f'Size mismatch: {project}/{bucket}/{path}'
                  digest=hashlib.sha256(content).hexdigest()
                  assert digest==obj['sourceSha256'],f'SHA256 mismatch: {project}/{bucket}/{path}'
                  dest=live/project/bucket/path
                  dest.parent.mkdir(parents=True,exist_ok=True)
                  dest.write_bytes(content)
                  verified.append({'projectId':project,'bucket':bucket,'path':path,'bytes':len(content),'sha256':digest})
          expected_total=manifest['totalBytes']*len(projects)
          assert len(verified)==21 and sum(x['bytes'] for x in verified)==expected_total
          shutil.copyfile('.github/recovery/taxpay-storage-integrity-manifest.json',root/'storage-integrity-manifest.json')
          archive=root/'sohojkor-public-storage-binaries.tar.gz'
          with tarfile.open(archive,'w:gz') as tf:
              tf.add(live,arcname='source-storage')
          restored=root/'isolated-restore'
          with tarfile.open(archive,'r:gz') as tf:
              members=tf.getmembers()
              assert all(m.name=='source-storage' or m.name.startswith('source-storage/') for m in members)
              assert all(not m.issym() and not m.islnk() for m in members)
              tf.extractall(restored,filter='data')
          for item in verified:
              content=(restored/'source-storage'/item['projectId']/item['bucket']/item['path']).read_bytes()
              assert len(content)==item['bytes']
              assert hashlib.sha256(content).hexdigest()==item['sha256']
          report={'sourceProjectIds':list(projects),'objectsPerProject':21,
                  'fileCount':len(verified),'totalBytes':expected_total,
                  'archiveSHA256':hashlib.sha256(archive.read_bytes()).hexdigest(),
                  'archiveBytes':archive.stat().st_size,'sha256Matches':len(verified),
                  'restoredFilesVerified':len(verified),'containsActualStorageBinaries':True,
                  'scope':'PUBLIC banner and branding objects only; NOT database/Auth recovery',
                  'result':'PASS'}
          (root/'restore-report.json').write_text(json.dumps(report,indent=2)+'\n')
          print('Verified public Storage objects in '+project+': 21/21')
          print('Verified offline binary restore in '+project+': 21/21')
          print('Archive SHA256: '+report['archiveSHA256'])
          shutil.rmtree(live)
          shutil.rmtree(restored)
          PY
      - name: Preserve verified binary archive and recovery evidence
        uses: actions/upload-artifact@v4
        with:
          name: sohojkor-public-storage-${{ matrix.project_id }}
          path: |
            storage-export/sohojkor-public-storage-binaries.tar.gz
            storage-export/storage-integrity-manifest.json
            storage-export/restore-report.json
          retention-days: 5
          if-no-files-found: error
