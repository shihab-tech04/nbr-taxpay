          node tests/integration/f137CombinationMatrix.mjs
          OFFICE_CONTAINER="ws3-office-sql-pg17-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          docker run --rm -d --name "$OFFICE_CONTAINER" \
            -e POSTGRES_PASSWORD=postgres -e POSTGRES_DB=postgres \
            -p 127.0.0.1::5432 postgres:17
          trap 'docker stop "$OFFICE_CONTAINER" >/dev/null 2>&1 || true' EXIT
          OFFICE_PORT="$(docker port "$OFFICE_CONTAINER" 5432/tcp | sed -n 's/^127\.0\.0\.1://p')"
          [[ "$OFFICE_PORT" =~ ^[0-9]+$ ]] && test "$OFFICE_PORT" -ne "$TAXPAY_LOCAL_DB_PORT"
          export WS3_TAXPAYER_DB_URL="$TAXPAY_LOCAL_PG_DSN"
          export WS3_OFFICE_DB_URL="postgresql://postgres:postgres@127.0.0.1:${OFFICE_PORT}/postgres"
          export WS3_OFFICE_SOURCE="$OFFICE_DIR"
          for attempt in $(seq 1 35); do
            if pg_isready -h 127.0.0.1 -p "$OFFICE_PORT" -U postgres -d postgres; then break; fi
            sleep 2
          done
          pg_isready -h 127.0.0.1 -p "$OFFICE_PORT" -U postgres -d postgres
          psql -X -v ON_ERROR_STOP=1 "$WS3_OFFICE_DB_URL" -c \
            "CREATE ROLE anon NOLOGIN; CREATE ROLE authenticated NOLOGIN; CREATE ROLE service_role NOLOGIN BYPASSRLS;"
          psql -X -v ON_ERROR_STOP=1 "$WS3_OFFICE_DB_URL" -f \
            "$OFFICE_DIR/tests/integration/officeMigrationAuthPrerequisite.sql"
