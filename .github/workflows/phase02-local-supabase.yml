name: TaxPay Phase 02 - disposable Auth, RLS and draft persistence

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Superseded PR checks may be replaced; never interrupt an in-progress
  # production-branch security check when another commit lands on main.
  group: taxpay-phase02-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Independent current-Office contract and build acceptance has no dependency on
  # the disposable TaxPay database. Run it alongside the complete SQL/RLS/browser
  # job; both remain mandatory within this workflow and the release check.
  current-office-contract:
    name: Current Office main contract and build
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
      - name: Verify current Office main source/build and shared TaxPay contracts
        shell: bash
        run: |
          set -euo pipefail
          OFFICE_CURRENT_DIR="$RUNNER_TEMP/office-current-main"
          git clone --depth 1 --branch main https://github.com/shihab-tech04/NBR-Officemanagment-UI-V2.git "$OFFICE_CURRENT_DIR"
          OFFICE_CURRENT_SHA="$(git -C "$OFFICE_CURRENT_DIR" rev-parse HEAD)"
          git -C "$OFFICE_CURRENT_DIR" checkout --detach "$OFFICE_CURRENT_SHA"
          test "$(git -C "$OFFICE_CURRENT_DIR" rev-parse HEAD)" = "$OFFICE_CURRENT_SHA"
          cmp -s src/contracts/paymentSimulationContract.ts "$OFFICE_CURRENT_DIR/src/app/contracts/paymentSimulationContract.ts"
          OFFICE_REPO="https://github.com/shihab-tech04/NBR-Officemanagment-UI-V2.git"
          OFFICE_BRIDGE_REF="main"
          if git ls-remote --exit-code --heads "$OFFICE_REPO" codex/correction-bridge-20261029 >/dev/null 2>&1; then
            OFFICE_BRIDGE_REF="codex/correction-bridge-20261029"
          fi
          OFFICE_BRIDGE_DIR="$RUNNER_TEMP/office-matching-bridge"
          git clone --depth 1 --branch "$OFFICE_BRIDGE_REF" "$OFFICE_REPO" "$OFFICE_BRIDGE_DIR"
          cmp -s supabase/functions/payment-sync-bridge/index.ts "$OFFICE_BRIDGE_DIR/supabase/functions/payment-sync-bridge/index.ts"
          cmp -s supabase/functions/payment-command-bridge/index.ts "$OFFICE_BRIDGE_DIR/supabase/functions/payment-command-bridge/index.ts"
          npm ci --prefix "$OFFICE_CURRENT_DIR" --no-audit --no-fund
          npm run build --prefix "$OFFICE_CURRENT_DIR"
          echo "Current Office main: $OFFICE_CURRENT_SHA; shared contract and app build PASS"
          echo "Matching Office bridge source: $OFFICE_BRIDGE_REF"
          echo "### Current Office integration boundary" >> "$GITHUB_STEP_SUMMARY"
          echo "Current Office main: \`$OFFICE_CURRENT_SHA\` — shared contract and Office production build PASS." >> "$GITHUB_STEP_SUMMARY"
          echo "Matching Office bridge source: \`$OFFICE_BRIDGE_REF\`; the paired correction bridge files are byte-identical." >> "$GITHUB_STEP_SUMMARY"


  disposable-backend:
    name: Isolated local Supabase acceptance (no hosted credentials)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install application dependencies
        run: npm ci --no-audit --no-fund

      - name: Prepare direct PostgreSQL client
        run: |
          if ! command -v psql >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq postgresql-client
          fi

      - uses: supabase/setup-cli@v3
        with:
          version: latest

      - name: Remove stale local TaxPay containers before starting
        run: supabase stop --no-backup || true

      - name: Start isolated disposable Supabase (no cloud link)
        run: |
          # Intentionally no `supabase link`, project reference, hosted credentials or db push.
          supabase start -x studio,imgproxy,realtime,storage-api,logflare,vector,supavisor,postgres-meta

      - name: Export only local synthetic API and SQL endpoints
        shell: bash
        run: |
          set -euo pipefail
          supabase status -o env | grep -E '^(API_URL|ANON_KEY|DB_URL)=' |
            sed -e 's/^API_URL=/TAXPAY_LOCAL_SUPABASE_URL=/' \
                -e 's/^ANON_KEY=/TAXPAY_LOCAL_SUPABASE_ANON_KEY=/' \
                -e 's/^DB_URL=/TAXPAY_LOCAL_PG_DSN=/' \
                -e 's/="\(.*\)"$/=\1/' >> "$GITHUB_ENV"
          grep -q '^TAXPAY_LOCAL_SUPABASE_URL=' "$GITHUB_ENV"
          grep -q '^TAXPAY_LOCAL_SUPABASE_ANON_KEY=' "$GITHUB_ENV"
          grep -q '^TAXPAY_LOCAL_PG_DSN=' "$GITHUB_ENV"
          echo "TAXPAY_LOCAL_RECOVERY_FILE=$RUNNER_TEMP/taxpay-restart-$GITHUB_RUN_ID.json" >> "$GITHUB_ENV"

      - name: Serve local Edge Functions for real-browser acceptance
        shell: bash
        run: |
          set -euo pipefail
          supabase functions serve --no-verify-jwt > "$RUNNER_TEMP/guest-beneficiaries-edge.log" 2>&1 &
          for attempt in $(seq 1 30); do
            code=$(curl --silent --show-error --output "$RUNNER_TEMP/guest-beneficiaries-probe.json" --write-out '%{http_code}' --max-time 5 \
              --request POST \
              --header "apikey: $TAXPAY_LOCAL_SUPABASE_ANON_KEY" \
              --header 'Content-Type: application/json' \
              --header 'Origin: http://127.0.0.1:4173' \
              --data '{"action":"open"}' \
              http://127.0.0.1:54321/functions/v1/taxpay-guest-beneficiaries 2>/dev/null || true)
            if [ "$code" = 400 ] && grep -q '"code":"INVALID_CAPABILITY"' "$RUNNER_TEMP/guest-beneficiaries-probe.json"; then
              echo "PASS: local guest beneficiary Edge Function rejects missing capabilities before database access"
              exit 0
            fi
            sleep 2
          done
          code=$(curl --silent --show-error --include --max-time 10 \
            --request POST \
            --header "apikey: $TAXPAY_LOCAL_SUPABASE_ANON_KEY" \
            --header 'Content-Type: application/json' \
            --header 'Origin: http://127.0.0.1:4173' \
            --data '{"action":"open"}' \
            http://127.0.0.1:54321/functions/v1/taxpay-guest-beneficiaries 2>&1 || true)
          echo "Final guest-function response:"
          echo "$code"
          echo "Guest Edge Function startup log:"
          cat "$RUNNER_TEMP/guest-beneficiaries-edge.log"
          echo "FAIL: local guest beneficiary Edge Function did not start" >&2
          exit 1

      - name: Verify applied migration count and owner-update grants
        shell: bash
        run: |
          set -euo pipefail
          node -e "const u=new URL(process.env.TAXPAY_LOCAL_PG_DSN); if(!['localhost','127.0.0.1','[::1]'].includes(u.hostname))process.exit(1)"
          export PGHOST=127.0.0.1 PGPORT=54322 PGDATABASE=postgres PGUSER=postgres PGPASSWORD=postgres
          expected_migrations="$(find supabase/migrations -maxdepth 1 -name '*.sql' | wc -l | tr -d '[:space:]')"
          applied_migrations="$(psql -X -Atqc 'select count(*) from supabase_migrations.schema_migrations')"
          test "$applied_migrations" = "$expected_migrations"
          test "$(psql -X -Atqc "select count(*) from public.taxpay_site_banners")" = 5
          test "$(psql -X -Atqc "select count(*) from pg_trigger where tgrelid='public.taxpay_site_banners'::regclass and tgname='taxpay_banner_preserve_canonical_intro'")" = 1
          test "$(psql -X -Atqc "select count(*) from pg_policies where schemaname='public' and tablename='taxpay_site_banners'")" = 9
          test "$(psql -X -Atqc "select to_regclass('public.sim_payment_transactions') is not null")" = t
          test "$(psql -X -Atqc "select to_regclass('public.sim_payment_allocations') is not null")" = t
          test "$(psql -X -Atqc "select to_regclass('demo_payment.mirror_outbox') is not null")" = t
          test "$(psql -X -Atqc "select count(*) from pg_policies where schemaname='public' and tablename='taxpay_payment_drafts' and cmd='UPDATE'")" = 1
          test "$(psql -X -Atqc "select count(*) from information_schema.column_privileges where table_schema='public' and table_name='taxpay_payment_drafts' and grantee='authenticated' and privilege_type='UPDATE'")" = 5
          test "$(psql -X -Atqc "select to_regclass('public.taxpay_beneficiaries') is not null and to_regclass('public.taxpay_beneficiary_lists') is not null")" = t
          # Eight owner-isolation policies; neither private table grants portal admins a cross-account read.
          test "$(psql -X -Atqc "select count(*) from pg_policies where schemaname='public' and tablename in ('taxpay_beneficiaries','taxpay_beneficiary_lists')")" = 8
          test "$(psql -X -Atqc "select count(*) from pg_policies where schemaname='public' and tablename in ('taxpay_beneficiaries','taxpay_beneficiary_lists') and cmd='SELECT' and policyname like '%verified_portal_admin'")" = 0
          test "$(psql -X -Atqc "select not has_table_privilege('anon','public.taxpay_beneficiaries','SELECT') and not has_table_privilege('anon','public.taxpay_beneficiary_lists','INSERT')")" = t
          echo "PASS: $applied_migrations ordered migrations installed, including canonical Main banner guard, private beneficiary storage, corrections and owner-update grants"

      - name: Verify capability-scoped guest beneficiary storage and owner isolation
        run: |
          export PGHOST=127.0.0.1 PGPORT=54322 PGDATABASE=postgres PGUSER=postgres PGPASSWORD=postgres
          psql -X -v ON_ERROR_STOP=1 -f tests/integration/guestBeneficiaryIsolation.sql

      - name: Verify nonempty per-User-ID profile persistence, saved list, language and isolation
        shell: bash
        run: |
          set -euo pipefail
          export PGHOST=127.0.0.1 PGPORT=54322 PGDATABASE=postgres PGUSER=postgres PGPASSWORD=postgres
          psql -X -v ON_ERROR_STOP=1 -f tests/integration/previewProfileNonemptyPersistence.sql

      - name: Verify account-scoped payment form drafts, readback, optimistic conflicts and cross-account isolation
        run: |
          set -euo pipefail
          export PGHOST=127.0.0.1 PGPORT=54322 PGDATABASE=postgres PGUSER=postgres PGPASSWORD=postgres
          psql -X -v ON_ERROR_STOP=1 -f tests/integration/accountPaymentFormDraftIsolation.sql

      - name: Verify unsigned guest form drafts using disposable SQL and real local Edge
        run: |
          set -euo pipefail
          export PGHOST=127.0.0.1 PGPORT=54322 PGDATABASE=postgres PGUSER=postgres PGPASSWORD=postgres
          psql -X -v ON_ERROR_STOP=1 -f tests/integration/guestPaymentFormDraftIsolation.sql
          psql -X -v ON_ERROR_STOP=1 -f tests/integration/demoRecipientNotices.sql
          node tests/integration/guestPaymentFormDraftEdge.mjs


      - name: Verify explicit prior-browser fictional payment recovery and isolation
        shell: bash
        run: |
          set -euo pipefail
          export PGHOST=127.0.0.1 PGPORT=54322 PGDATABASE=postgres PGUSER=postgres PGPASSWORD=postgres
          psql -X -v ON_ERROR_STOP=1 -f tests/integration/legacyStoryPaymentRecovery.sql

      - name: Verify capability-scoped demo payment read and write paths
        shell: bash
        run: |
          set -euo pipefail
          export PGHOST=127.0.0.1 PGPORT=54322 PGDATABASE=postgres PGUSER=postgres PGPASSWORD=postgres
          psql -X -v ON_ERROR_STOP=1 -f tests/integration/demoProfilePaymentScope.sql
          psql -X -v ON_ERROR_STOP=1 -f tests/integration/combinedOtherTaxSqlAcceptance.sql
          # Verify session knowledge alone cannot claim another account's payment.
          psql -X -v ON_ERROR_STOP=1 -f tests/integration/story1OwnerClaimIsolation.sql
          # F-167: guest payer TIN guards reject forged IDs and receipt data.
          psql -X -v ON_ERROR_STOP=1 -f tests/integration/walkinPayerTinGuard.sql
      - name: Verify TaxPay correction intake, Office review state transitions and owner readback
        run: |
          export PGHOST=127.0.0.1 PGPORT=54322 PGDATABASE=postgres PGUSER=postgres PGPASSWORD=postgres
          psql -X -v ON_ERROR_STOP=1 -f tests/integration/correctionOfficeReadback.sql

      - name: Verify atomic mirror outbox, service-only claims, ACK and outage retry
        run: |
          export PGHOST=127.0.0.1 PGPORT=54322 PGDATABASE=postgres PGUSER=postgres PGPASSWORD=postgres
          psql -X -v ON_ERROR_STOP=1 -f tests/integration/story1MirrorOutbox.sql

      - name: Verify all ten SQL personas and eight publicly read-only simulated tax services
        shell: bash
        run: |
          set -euo pipefail
          export PGHOST=127.0.0.1 PGPORT=54322 PGDATABASE=postgres PGUSER=postgres PGPASSWORD=postgres
          psql -X -v ON_ERROR_STOP=1 -f tests/integration/verifySyntheticServiceProfiles.sql

      - name: Verify primary administrator identity requires email confirmation (rollback only)
        shell: bash
        run: |
          set -euo pipefail
          export PGHOST=127.0.0.1 PGPORT=54322 PGDATABASE=postgres PGUSER=postgres PGPASSWORD=postgres
          psql -X -v ON_ERROR_STOP=1 -f tests/integration/verifiedPrimaryAdmin.sql

      - name: Rehearse verified-admin-only CMS policies on isolated PostgreSQL
        shell: bash
        run: |
          set -euo pipefail
          export PGHOST=127.0.0.1 PGPORT=54322 PGDATABASE=postgres PGUSER=postgres PGPASSWORD=postgres
          psql -X -v ON_ERROR_STOP=1 -f docs/security/taxpay-cms-anonymous-write-lockdown-20261024.sql
          psql -X -v ON_ERROR_STOP=1 -f tests/integration/cmsVerifiedAdminAccess.sql

      - name: Verify exact synthetic SQL seed totals and event graph (rollback only)
        shell: bash
        run: |
          set -euo pipefail
          export PGHOST=127.0.0.1 PGPORT=54322 PGDATABASE=postgres PGUSER=postgres PGPASSWORD=postgres
          psql -X -v ON_ERROR_STOP=1 -f tests/integration/localSyntheticSeedGraph.sql

      - name: Verify atomic multi-beneficiary synthetic payment API, RLS and rollback
        shell: bash
        run: |
          set -euo pipefail
          export PGHOST=127.0.0.1 PGPORT=54322 PGDATABASE=postgres PGUSER=postgres PGPASSWORD=postgres
          psql -X -v ON_ERROR_STOP=1 -f tests/integration/simulatedPaymentAcceptance.sql

      - name: Verify new synthetic officer review DDL is installed
        run: |
          export PGHOST=127.0.0.1 PGPORT=54322 PGDATABASE=postgres PGUSER=postgres PGPASSWORD=postgres
          test "$(psql -X -Atqc "select to_regclass('public.sim_payment_officer_decisions') is not null")" = t
          test "$(psql -X -Atqc "select count(*) from pg_proc p join pg_namespace n on n.oid=p.pronamespace where n.nspname='public' and p.proname='sim_payment_officer_action'")" = 1

      - name: Run real local Auth + PostgREST + direct SQL ownership checks
        run: npm run test:integration:local

      - name: Verify non-financial taxpayer-to-officer SQL, RLS, notifications and idempotency
        run: node tests/integration/nonFinancialSync.mjs

      - name: Verify real local three-officer simulation statuses and recipient notifications
        run: node tests/integration/simOfficerReview.mjs

      - name: Verify authenticated synthetic profile scope, notice state, and simulated reversal
        run: node tests/integration/simPrivateLifecycle.mjs

      - name: Verify actual email magic-link authentication against disposable Mailpit
        run: node tests/integration/localMagicLinkAuth.mjs

      - name: Restore local UI Playwright browser cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: taxpay-pw-shell-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-v1
      - name: Install headless Chromium for real local authenticated UI
        run: npx playwright install chromium --only-shell

      - name: Test React draft save, edit and account isolation against real local Supabase
        env:
          VITE_SUPABASE_DISABLED: 'false'
          VITE_SUPABASE_URL: ${{ env.TAXPAY_LOCAL_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ env.TAXPAY_LOCAL_SUPABASE_ANON_KEY }}
        run: npx playwright test tests/e2e/secure-workspace-real-local.spec.ts --project=mobile-375

      - name: Verify real saved beneficiaries, account isolation and Pay Tax prefill
        env:
          VITE_SUPABASE_DISABLED: 'false'
          VITE_SUPABASE_URL: ${{ env.TAXPAY_LOCAL_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ env.TAXPAY_LOCAL_SUPABASE_ANON_KEY }}
        run: npx playwright test tests/e2e/beneficiaries-real-local.spec.ts tests/e2e/beneficiary-list-management-real-local.spec.ts tests/e2e/beneficiary-move-list-real-local.spec.ts tests/e2e/account-preferences-real-local.spec.ts --project=mobile-375

      - name: Verify guest beneficiary persistence, isolation, XLSX and Pay Tax prefill
        env:
          VITE_SUPABASE_DISABLED: 'false'
          VITE_SUPABASE_URL: ${{ env.TAXPAY_LOCAL_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ env.TAXPAY_LOCAL_SUPABASE_ANON_KEY }}
        run: npx playwright test tests/e2e/beneficiaries-guest-real-local.spec.ts --project=mobile-375

      - name: Verify real demo User ID persistence and isolation across desktop and mobile browsers
        env:
          VITE_SUPABASE_DISABLED: 'false'
          VITE_SUPABASE_URL: ${{ env.TAXPAY_LOCAL_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ env.TAXPAY_LOCAL_SUPABASE_ANON_KEY }}
          TAXPAY_LOCAL_SUPABASE_URL: ${{ env.TAXPAY_LOCAL_SUPABASE_URL }}
          TAXPAY_LOCAL_SUPABASE_ANON_KEY: ${{ env.TAXPAY_LOCAL_SUPABASE_ANON_KEY }}
        run: npx playwright test tests/e2e/demo-profile-persistence-real-local.spec.ts --project=desktop-1280 --project=mobile-375 --workers=1

      - name: Report local profile-history RPC diagnostics after failure
        if: failure()
        shell: bash
        run: |
          set -euo pipefail
          edge_log="$RUNNER_TEMP/guest-beneficiaries-edge.log"
          if [ -f "$edge_log" ]; then
            matches="$(grep -F 'Profile payment history' "$edge_log" || true)"
            if [ -n "$matches" ]; then
              printf '%s\n' "$matches"
            else
              echo "No profile-history RPC error was logged by the local Edge Function."
            fi
          else
            echo "Local Edge Function log was not found."
          fi

      - name: Verify actual two-browser SQL Save Draft, resume, conflict and cross-account isolation
        env:
          VITE_SUPABASE_DISABLED: "false"
          VITE_SUPABASE_URL: ${{ env.TAXPAY_LOCAL_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ env.TAXPAY_LOCAL_SUPABASE_ANON_KEY }}
        run: npx playwright test tests/e2e/account-payment-drafts-real-local.spec.ts --project=mobile-375 --workers=1

      - name: Verify complete Save Draft / Continue Draft React UI across two real browser contexts
        env:
          VITE_SUPABASE_DISABLED: "false"
          VITE_SUPABASE_URL: ${{ env.TAXPAY_LOCAL_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ env.TAXPAY_LOCAL_SUPABASE_ANON_KEY }}
        run: |
          set -euo pipefail
          # user27–30 owner pairs are isolated by project, so these can run together.
          npx playwright test tests/e2e/account-payment-draft-browser-ui-real-local.spec.ts --project=desktop-1280 --project=mobile-375 --workers=2 --grep 'payment form drafts survive another browser'
          # The Overview case necessarily exercises user1 in both projects.
          # Serializing only this case prevents cross-project writes to one owner.
          npx playwright test tests/e2e/account-payment-draft-browser-ui-real-local.spec.ts --project=desktop-1280 --project=mobile-375 --workers=1 --grep 'user1 Overview shows account-scoped saved drafts'

      - name: Verify SQL profiles and all eight service types render for real preview identities
        env:
          VITE_SUPABASE_DISABLED: 'false'
          VITE_SUPABASE_URL: ${{ env.TAXPAY_LOCAL_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ env.TAXPAY_LOCAL_SUPABASE_ANON_KEY }}
        run: npx playwright test tests/e2e/sql-sample-services-real-local.spec.ts --project=desktop-1280

      - name: Verify live React synthetic multi-beneficiary payment, cross-account notices and officer read-back
        env:
          VITE_SUPABASE_DISABLED: 'false'
          VITE_SUPABASE_URL: ${{ env.TAXPAY_LOCAL_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ env.TAXPAY_LOCAL_SUPABASE_ANON_KEY }}
        run: npx playwright test tests/e2e/sim-private-real-local.spec.ts --project=mobile-375

      - name: Verify certified historical three-officer TaxPay Office E2E with real disposable SQL
        env:
          VITE_SUPABASE_DISABLED: 'false'
          VITE_SUPABASE_URL: ${{ env.TAXPAY_LOCAL_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ env.TAXPAY_LOCAL_SUPABASE_ANON_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          node -e "const u=new URL(process.env.TAXPAY_LOCAL_SUPABASE_URL); if(!['127.0.0.1','localhost'].includes(u.hostname))process.exit(1)"
          OFFICE_DIR="$RUNNER_TEMP/office-cross-app"
          git clone --depth 1 --branch main https://github.com/shihab-tech04/NBR-Officemanagment-UI-V2.git "$OFFICE_DIR"
          # Freeze the original certified officer-capable Office revision for
          # the historical Maker/Reviewer/Approver browser assertions below.
          # Current Office main is independently verified by the parallel required job.
          OFFICE_SHA="96d766e4ff8b977e19d8c259c5f21c3424f81580"
          git -C "$OFFICE_DIR" fetch --depth 1 origin "$OFFICE_SHA"
          git -C "$OFFICE_DIR" checkout --detach "$OFFICE_SHA"
          test "$(git -C "$OFFICE_DIR" rev-parse HEAD)" = "$OFFICE_SHA"
          # The historical contract must compare with the pinned historical TaxPay source,
          # not this PR's expanded 30-account contract. Current Office parity is checked above.
          # Confirm the pinned historical Office app matched the pre-correction
          # TaxPay bridge source; the additive correction routes are exercised
          # against the paired Office bridge branch in the step above.
          TAXPAY_HISTORICAL_SHA="8159a80d584cc28194bf1e3efe0e304e0f2bd9fd"
          git fetch --depth 1 origin "$TAXPAY_HISTORICAL_SHA"
          git show "$TAXPAY_HISTORICAL_SHA:src/contracts/paymentSimulationContract.ts" > "$RUNNER_TEMP/paymentSimulationContract-historical.ts"
          cmp -s "$RUNNER_TEMP/paymentSimulationContract-historical.ts" "$OFFICE_DIR/src/app/contracts/paymentSimulationContract.ts"
          for bridge in payment-sync-bridge payment-command-bridge; do
            git show "$TAXPAY_HISTORICAL_SHA:supabase/functions/$bridge/index.ts" > "$RUNNER_TEMP/$bridge-historical.ts"
            cmp -s "$RUNNER_TEMP/$bridge-historical.ts" "$OFFICE_DIR/supabase/functions/$bridge/index.ts"
          done
          test "$(find supabase/hosted_migration_history -name '*.sql' | wc -l)" = 17
          test "$(find "$OFFICE_DIR/supabase/hosted_migration_history" -name '*.sql' | wc -l)" = 17
          echo "PASS: shared contract, historical bridge base, paired correction bridge, and both hosted migration recovery sets"
          npm ci --prefix "$OFFICE_DIR" --no-audit --no-fund
          (
            cd "$OFFICE_DIR"
            VITE_TAXPAY_REVIEW_URL="$TAXPAY_LOCAL_SUPABASE_URL" \
            VITE_TAXPAY_REVIEW_PUBLIC_KEY="$TAXPAY_LOCAL_SUPABASE_ANON_KEY" \
            VITE_TAXPAY_REVIEW_DISABLED=false \
            VITE_OFFICE_PUBLIC_UI_ONLY=false \
            ./node_modules/.bin/vite --host 127.0.0.1 --port 4174 > "$RUNNER_TEMP/office-cross-app.log" 2>&1
          ) &
          OFFICE_PID=$!
          trap 'kill "$OFFICE_PID" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 35); do
            if curl -fsS -o /dev/null http://127.0.0.1:4174/payments/transactions; then break; fi
            sleep 2
          done
          curl -fsS -o /dev/null http://127.0.0.1:4174/payments/transactions
          npx playwright test tests/e2e/taxpay-office-complete-local.spec.ts --project=mobile-375
          npx playwright test tests/e2e/taxpay-office-private-review-local.spec.ts --project=mobile-375

      - name: Restart disposable database services without deleting volumes
        run: |
          supabase stop
          supabase start -x studio,imgproxy,realtime,storage-api,edge-runtime,logflare,vector,supavisor,postgres-meta

      - name: Reauthenticate both synthetic owners and verify exact rows after restart
        run: node tests/integration/localDraftRestartReadBack.mjs

      - name: Remove disposable synthetic credentials
        if: always()
        shell: bash
        run: |
          if [ -n "${TAXPAY_LOCAL_RECOVERY_FILE:-}" ]; then rm -f -- "$TAXPAY_LOCAL_RECOVERY_FILE"; fi
