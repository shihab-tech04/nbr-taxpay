          WS1_SHA="682ff48dc055c8a8ab782f918cf18dccfe0e1080"
          git -C "$WS1_DIR" fetch --depth 1 origin "$WS1_SHA"
          git -C "$WS1_DIR" checkout --detach "$WS1_SHA"
          test "$(git -C "$WS1_DIR" rev-parse HEAD)" = "$WS1_SHA"
          echo "Current Work A #779 source SHA: $WS1_SHA"
          export WS1_SOURCE_DIR="$WS1_DIR"
          export WS1_SOURCE_SHA="$WS1_SHA"
          export WS3_F137_MATRIX_FIXTURE_OUT="$RUNNER_TEMP/f137-t01-matrix.json"
