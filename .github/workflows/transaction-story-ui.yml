name: Transaction Story UI Integrity
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
    branches: [main]
    paths:
      - 'src/components/screens/PaymentWizard.tsx'
      - 'src/components/screens/DemoPaymentActivity.tsx'
      - 'src/components/screens/TravelTax.tsx'
      - 'src/services/simulatedPaymentStory.ts'
      - '.github/workflows/transaction-story-ui.yml'
  workflow_dispatch:
permissions:
  contents: read
# Cancel only superseded updates to this same PR; manual acceptance stays independent.
concurrency:
  group: taxpay-transaction-ui-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    if: (github.event_name != 'pull_request' || github.event.pull_request.draft != true || github.event.pull_request.base.ref != 'main' || startsWith(github.head_ref, 'ws5/'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '24',cache: npm}
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm run test:domain
      - run: npm run build
        env:
          GITHUB_PAGES: 'true'
          VITE_SUPABASE_DISABLED: 'false'
          VITE_SUPABASE_URL: 'https://eyqhoavnitkrajvyqvxn.supabase.co'
