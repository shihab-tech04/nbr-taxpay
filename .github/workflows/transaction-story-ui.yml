name: Transaction Story UI Integrity
on:
  pull_request:
    branches: [main]
    paths:
      - 'src/components/screens/PaymentWizard.tsx'
      - 'src/components/screens/DemoPaymentActivity.tsx'
      - 'src/components/screens/CorrectionInquiries.tsx'
      - 'src/components/screens/TravelTax.tsx'
      - 'src/services/simulatedPaymentStory.ts'
      - 'tests/e2e/taxpayer-transaction-rows.spec.ts'
      - 'tests/e2e/account-tax-journey-private.spec.ts'
      - 'src/components/screens/PreviewDashboardBento.tsx'
      - 'src/components/screens/TaxpayerDashboard.tsx'
      - 'src/services/story1AccountPaymentHistory.ts'
      - 'src/services/confirmedPaymentCertificate.ts'
      - 'src/services/previewAccountSession.ts'
      - 'src/services/taxState.tsx'
      - 'tests/e2e/dashboard-unified-preview.spec.ts'
      - '.github/workflows/transaction-story-ui.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '24',cache: npm}
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm run test:domain
      - run: npm run build
        env:
          GITHUB_PAGES: 'true'
          VITE_SUPABASE_DISABLED: 'false'
          VITE_SUPABASE_URL: 'https://eyqhoavnitkrajvyqvxn.supabase.co'
      - name: Install Playwright Chromium
        run: npx playwright install chromium
      - name: Verify User2 Activity history-first flow in English and Bengali across 320, 375, 390, 768 and 1280px
        env:
          VITE_SUPABASE_DISABLED: 'true'
        run: >-
          npx playwright test tests/e2e/taxpayer-transaction-rows.spec.ts
          --project=desktop-1280 --project=mobile-320 --workers=1
          --grep "User2 Activity opens on transaction history"
      - name: Verify User2 authenticated correction context in English and Bengali across 320, 375, 390, 768 and 1280px
        env:
          VITE_SUPABASE_DISABLED: 'false'
          VITE_SUPABASE_URL: 'https://nbr-taxpay-test.invalid'
          VITE_SUPABASE_PUBLISHABLE_KEY: 'synthetic-public-test-key'
        run: >-
          npx playwright test tests/e2e/account-tax-journey-private.spec.ts
          --project=desktop-1280 --project=mobile-320 --workers=1
          --grep "User2 transaction correction opens a locked, contextual modal"
      - name: Verify User2 correction KPI zero and unavailable states
        env:
          VITE_SUPABASE_DISABLED: 'false'
          VITE_SUPABASE_URL: 'https://nbr-taxpay-test.invalid'
          VITE_SUPABASE_PUBLISHABLE_KEY: 'synthetic-public-test-key'
        run: >-
          npx playwright test tests/e2e/dashboard-unified-preview.spec.ts
          --project=desktop-1280 --project=mobile-375 --workers=1
          --grep "recipient-first dashboard keeps the approved structure with an empty|unavailable history must not masquerade as an empty account|User2 correction KPI localizes zero and action in Bengali"
