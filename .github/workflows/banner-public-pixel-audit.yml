name: Read-only TaxPay published banner pixel audit
on:
  push:
    branches:
      - 'audit/live-banner-pixel-parity-*'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compare-image-pixels:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned image decoder
        run: python -m pip install Pillow==11.3.0
      - name: Compare all five current published image objects without modifying them
        run: python scripts/audit_public_banner_pixels.py
      - name: Display report in GitHub summary
        if: always()
        run: if [ -f banner-pixel-audit.md ]; then cat banner-pixel-audit.md >> "$GITHUB_STEP_SUMMARY"; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: banner-pixel-parity-evidence
          path: |
            banner-pixel-audit.json
            banner-pixel-audit.md
          retention-days: 7
