name: Temporary Office Material UI lockfile resolver
on:
  push:
    branches:
      - fix/office-mui-source-20261011
permissions:
  contents: write
jobs:
  resolve:
    if: contains(github.event.head_commit.message, '[resolve-office-lock]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: true
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
      - name: Resolve locked Office Management dependencies
        run: |
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          npm ci --ignore-scripts --no-audit --no-fund
      - name: Commit the resolved lockfile on this branch only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package-lock.json
          git commit -m 'chore: lock exact Office Management MUI dependencies' || exit 0
          git push origin HEAD:fix/office-mui-source-20261011
