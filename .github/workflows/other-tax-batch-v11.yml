name: TaxPay Other Tax v11 multi-taxpayer acceptance

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/components/screens/GuestPayment.tsx'
      - 'src/components/screens/OtherTaxTaxpayerList.tsx'
      - 'src/components/screens/TravelTax.tsx'
      - 'src/components/ui/TaxpayerTinLookup.tsx'
      - 'src/styles/taxpay-payment-form.css'
      - 'src/styles/taxpayer-tin-lookup.css'
      - 'src/styles/taxpay-form-labels.css'
      - 'src/components/screens/OtherTaxBatchComposer.tsx'
      - 'src/services/otherTaxBatchSubmission.ts'
      - 'tests/otherTaxBatchSubmission.test.ts'
      - 'tests/e2e/other-tax-batch-v11.spec.ts'
      - 'tests/e2e/other-tax-travel-interaction-parity.spec.ts'
      - 'tests/e2e/shared-taxpayer-tin-lookup.spec.ts'
      - 'tests/e2e/payment-payer-email-layout.spec.ts'
      - 'tests/e2e/other-tax-bulk-summary-ux.spec.ts'
      - 'tests/e2e/other-tax-all-heads-visible.spec.ts'
      - 'tests/e2e/other-tax-batch-submit.spec.ts'
      - '.github/workflows/other-tax-batch-v11.yml'
  push:
    branches: [main]
    paths:
      - 'src/components/screens/GuestPayment.tsx'
      - 'src/components/screens/OtherTaxTaxpayerList.tsx'
      - 'src/components/screens/TravelTax.tsx'
      - 'src/components/ui/TaxpayerTinLookup.tsx'
      - 'src/styles/taxpay-payment-form.css'
      - 'src/styles/taxpayer-tin-lookup.css'
      - 'src/styles/taxpay-form-labels.css'
      - 'src/components/screens/OtherTaxBatchComposer.tsx'
      - 'src/services/otherTaxBatchSubmission.ts'
      - 'tests/otherTaxBatchSubmission.test.ts'
      - 'tests/e2e/other-tax-batch-v11.spec.ts'
      - 'tests/e2e/other-tax-travel-interaction-parity.spec.ts'
      - 'tests/e2e/shared-taxpayer-tin-lookup.spec.ts'
      - 'tests/e2e/payment-payer-email-layout.spec.ts'
      - 'tests/e2e/other-tax-batch-submit.spec.ts'
      - 'tests/e2e/other-tax-all-heads-visible.spec.ts'
      - '.github/workflows/other-tax-batch-v11.yml'

concurrency:
  group: taxpay-other-tax-v11-${{ github.ref }}
  # Cancel only obsolete PR attempts; never cancel production main runs.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  verify:
    name: Grouped heads, taxpayer composition and safe checkout
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: TypeScript and domain acceptance
        run: |
          npm run lint
          npm run test:domain
      - name: Restore Playwright headless Chromium cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: taxpay-pw-shell-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-v1
      - name: Install Playwright Chromium
        run: npx playwright install chromium --only-shell
      - name: Test grouped heads, individual records and retry recovery
        env:
          VITE_SUPABASE_DISABLED: 'true'
          VITE_SUPABASE_URL: ''
          VITE_SUPABASE_PUBLISHABLE_KEY: ''
        run: npx playwright test tests/e2e/other-tax-batch-v11.spec.ts tests/e2e/other-tax-travel-interaction-parity.spec.ts tests/e2e/shared-taxpayer-tin-lookup.spec.ts tests/e2e/other-tax-batch-submit.spec.ts tests/e2e/other-tax-bulk-summary-ux.spec.ts tests/e2e/other-tax-all-heads-visible.spec.ts tests/e2e/payment-payer-email-layout.spec.ts
      - name: Upload Playwright evidence on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: other-tax-batch-v11-failure-evidence
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore