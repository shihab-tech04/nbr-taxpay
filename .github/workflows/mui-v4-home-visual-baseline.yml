name: MUI strict homepage previous-run pixel diagnosis
on:
  push:
    branches: [ops/mui-v4-visual-baseline-bb3fcb77]
permissions:
  actions: read
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Fetch exact failed visual evidence without rerunning screenshots
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/${{ github.repository }}/actions/artifacts/15054482971/zip" -o "$RUNNER_TEMP/visual.zip"
          printf '%s  %s\n' 'bf67a73498df5678c2baf4fd87e6e578b680d37f9d73f1239e5fb8682c186739' "$RUNNER_TEMP/visual.zip" | sha256sum -c -
          node scripts/ci/mui-v53-visual-diagnose.mjs "$RUNNER_TEMP/visual.zip" > pixel-diagnosis.json
          cat pixel-diagnosis.json
      - uses: actions/upload-artifact@v4
        with:
          name: mui-v53-pixel-diagnosis-45680680337
          path: pixel-diagnosis.json
          retention-days: 30
