name: MUI active tables exact-Main strict protected-home acceptance
on:
  push:
    branches: [ops/mui-v4-visual-baseline-bb3fcb77]
permissions:
  contents: read
jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CI: 'true'
      VITE_SUPABASE_DISABLED: 'true'
      VITE_SUPABASE_URL: ''
      VITE_SUPABASE_PUBLISHABLE_KEY: ''
      BASE_SHA: e58d364872cdd1b175a4a672ed276e09bdca9546
      CANDIDATE_SHA: fde278b3c851458cf898db450e716ec094c9432c
      DIAGNOSTIC_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fde278b3c851458cf898db450e716ec094c9432c
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
      - name: Build exact table candidate and exact Main
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          git merge-base --is-ancestor "$BASE_SHA" "$CANDIDATE_SHA"
          npm ci --no-audit --no-fund
          npm run build
          git show "$DIAGNOSTIC_SHA:tests/visual/mui-v60-paint-probe.spec.ts" > tests/visual/mui-v4-protected-home.spec.ts
          grep -F -- '--run-all-compositor-stages-before-draw' playwright.mui-protected.config.ts
          grep -F -- 'workers:1,retries:0' playwright.mui-protected.config.ts
          export MUI_BASELINE_DIR="$RUNNER_TEMP/mui-exact-main"
          mkdir -p "$MUI_BASELINE_DIR"
          git archive "$BASE_SHA" | tar -x -C "$MUI_BASELINE_DIR"
          (cd "$MUI_BASELINE_DIR" && npm ci --no-audit --no-fund && npm run build)
          npx playwright install chromium
      - name: Full strict 40-case matrix after successful five-case compositor experiment
        run: |
          set -euo pipefail
          export MUI_BASELINE_DIR="$RUNNER_TEMP/mui-exact-main"
          export MUI_SNAPSHOT_DIR="$RUNNER_TEMP/mui-snapshots"
          mkdir -p "$MUI_SNAPSHOT_DIR"
          printf '%s\n' "$BASE_SHA" > "$MUI_SNAPSHOT_DIR/BASE_SHA"
          printf '%s\n' "$CANDIDATE_SHA" > "$MUI_SNAPSHOT_DIR/CANDIDATE_SHA"
          npx playwright test --config playwright.mui-protected.config.ts --list | tee "$MUI_SNAPSHOT_DIR/test-selection.txt"
          grep -F 'Total: 40 tests' "$MUI_SNAPSHOT_DIR/test-selection.txt"
          cp playwright.mui-protected.config.ts "$MUI_SNAPSHOT_DIR/experiment-config.ts"
          npx playwright test --config playwright.mui-protected.config.ts --workers=1
      - name: Independently verify all exact PNG and paint probe pairs
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import os, json
          root=Path(os.environ['RUNNER_TEMP'])/'mui-snapshots'
          candidates=list(root.rglob('candidate-*.png'))
          assert len(candidates)==160, len(candidates)
          for c in candidates:
              name=c.name.removeprefix('candidate-')
              main=c.with_name(name)
              control=c.with_name('main-control-'+name)
              assert main.read_bytes()==control.read_bytes()==c.read_bytes(),name
              ma=json.loads(c.with_name('main-paint-'+name+'.json').read_text())
              ca=json.loads(c.with_name('candidate-paint-'+name+'.json').read_text())
              assert ma==ca,(str(c),'paint probe differs')
          print('160/160 exact Main/control/candidate PNG and paint probe pairs PASS')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mui-active-tables-current-main-e58d3648
          path: |
            ${{ runner.temp }}/mui-snapshots
            test-results/
          if-no-files-found: error
          retention-days: 7
