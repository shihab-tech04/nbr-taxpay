name: MUI v6.0 targeted foundation paint attribution
on:
  push:
    branches: [ops/mui-v4-visual-baseline-bb3fcb77]
permissions:
  contents: read
  actions: read
jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CI: 'true'
      VITE_SUPABASE_DISABLED: 'true'
      VITE_SUPABASE_URL: ''
      VITE_SUPABASE_PUBLISHABLE_KEY: ''
      BASE_SHA: dd366bbfb97d09faf6252f43d1f3b3d07d6ad88f
      CANDIDATE_SHA: 84bc1da27e3108db1e8f855f69011fc4b5b84d86
      DIAGNOSTIC_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 84bc1da27e3108db1e8f855f69011fc4b5b84d86
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
      - name: Build exact candidate and Main with original dependencies
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          git merge-base --is-ancestor "$BASE_SHA" "$CANDIDATE_SHA"
          npm ci --no-audit --no-fund
          npm run build
          git show "$DIAGNOSTIC_SHA:tests/visual/mui-v60-paint-probe.spec.ts" > tests/visual/mui-v4-protected-home.spec.ts
          export MUI_BASELINE_DIR="$RUNNER_TEMP/mui-exact-main"
          mkdir -p "$MUI_BASELINE_DIR"
          git archive "$BASE_SHA" | tar -x -C "$MUI_BASELINE_DIR"
          (cd "$MUI_BASELINE_DIR" && npm ci --no-audit --no-fund && npm run build)
          npx playwright install chromium
      - name: Targeted 320px failure attribution (not full release acceptance)
        run: |
          set -euo pipefail
          export MUI_BASELINE_DIR="$RUNNER_TEMP/mui-exact-main"
          export MUI_SNAPSHOT_DIR="$RUNNER_TEMP/mui-snapshots"
          mkdir -p "$MUI_SNAPSHOT_DIR"
          printf '%s\n' "$BASE_SHA" > "$MUI_SNAPSHOT_DIR/BASE_SHA"
          printf '%s\n' "$CANDIDATE_SHA" > "$MUI_SNAPSHOT_DIR/CANDIDATE_SHA"
          npx playwright test --config playwright.mui-protected.config.ts --project=width-320 --grep 'frozen homepage en (light guest|dark local-account)
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mui-v60-foundation-targeted-paint-attribution
          path: |
            ${{ runner.temp }}/mui-snapshots
            test-results/
          if-no-files-found: error
          retention-days: 7


      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mui-v60-foundation-exact-full-home-matrix
          path: |
            ${{ runner.temp }}/mui-snapshots
            test-results/
          if-no-files-found: error
          retention-days: 7

