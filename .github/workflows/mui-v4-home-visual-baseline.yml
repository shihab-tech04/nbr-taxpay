name: MUI v7.0 original and targeted paint evidence attribution
on:
  push:
    branches: [ops/mui-v4-visual-baseline-bb3fcb77]
permissions:
  contents: read
  actions: read
jobs:
  attribute:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        case:
          - label: foundation
            original_run: 45698521102
            original_artifact: mui-v60-foundation-exact-full-home-matrix
            targeted_artifact: mui-v70-targeted-paint-foundation-light-guest
            filename: default-en-light-guest.png
          - label: combined
            original_run: 45693443551
            original_artifact: mui-v4-combined-acceptance
            targeted_artifact: mui-v70-targeted-paint-combined-dark-account
            filename: default-en-dark-local-account.png
    steps:
      - uses: actions/download-artifact@v4
        with:
          run-id: ${{ matrix.case.original_run }}
          name: ${{ matrix.case.original_artifact }}
          github-token: ${{ github.token }}
          path: original
      - uses: actions/download-artifact@v4
        with:
          run-id: 45702410656
          name: ${{ matrix.case.targeted_artifact }}
          github-token: ${{ github.token }}
          path: targeted
      - name: Compare original failures to independent exact-source captures
        env:
          CASE_FILE: ${{ matrix.case.filename }}
        run: |
          set -euo pipefail
          python -m pip install --quiet Pillow==12.0.0
          mkdir -p diagnosis
          python - <<'PY'
          import os, json, hashlib
          from pathlib import Path
          from PIL import Image, ImageChops
          name=os.environ['CASE_FILE']
          def locate(root, filename):
              matches=[p for p in Path(root).rglob(filename) if 'width-320' in p.parts]
              assert len(matches)==1,(root,filename,matches)
              return matches[0]
          files={key:locate(root,prefix+name) for key,root,prefix in [
              ('old_main','original',''),('old_candidate','original','candidate-'),
              ('old_control','original','main-control-'),('new_main','targeted',''),
              ('new_candidate','targeted','candidate-'),('new_control','targeted','main-control-')]}
          def compare(a,b):
              A,B=files[a],files[b]
              with Image.open(A) as ai, Image.open(B) as bi:
                  x,y=ai.convert('RGB'),bi.convert('RGB')
                  result={'a':a,'b':b,'bytes_equal':A.read_bytes()==B.read_bytes(),'size_a':x.size,'size_b':y.size}
                  if x.size==y.size:
                      d=ImageChops.difference(x,y)
                      points=[(i%x.width,i//x.width) for i,p in enumerate(d.getdata()) if p!=(0,0,0)]
                      result.update(pixel_count=len(points),bbox=d.getbbox(),first_coordinates=points[:40])
                      if points:
                          bbox=d.getbbox()
                          region=(max(0,bbox[0]-16),max(0,bbox[1]-16),min(x.width,bbox[2]+16),min(x.height,bbox[3]+16))
                          if (region[2]-region[0])*(region[3]-region[1])<=250000:
                              x.crop(region).save('diagnosis/'+a+'-'+b+'-a.png')
                              y.crop(region).save('diagnosis/'+a+'-'+b+'-b.png')
                      return result
                  return result
          probes={}
          for label in ['main','candidate']:
              p=locate('targeted',label+'-paint-'+name+'.json')
              probes[label]=json.loads(p.read_text())
          report={'files':{k:{'sha256':hashlib.sha256(p.read_bytes()).hexdigest(),'bytes':p.stat().st_size} for k,p in files.items()},
              'comparisons':[compare(a,b) for a,b in [('old_main','old_control'),('old_main','old_candidate'),('new_main','new_control'),('new_main','new_candidate'),('old_main','new_main'),('old_candidate','new_main')]],
              'targeted_paint_equal':probes['main']==probes['candidate'],'targeted_fixed_equal':probes['main'].get('fixed')==probes['candidate'].get('fixed'),
              'targeted_points_equal':probes['main'].get('points')==probes['candidate'].get('points'),
              'targeted_probes':probes}
          Path('diagnosis/report.json').write_text(json.dumps(report,indent=2))
          print(json.dumps({k:v for k,v in report.items() if k!='targeted_probes'},indent=2))
          for label,probe in probes.items():
              print(label,'viewport',probe.get('viewport'),'fixed',[(x.get('tag'),x.get('classes'),x.get('rect')) for x in probe.get('fixed',[])])
              print(label,'hit stacks',[(x.get('x'),x.get('y'),[(e.get('tag'),e.get('classes'),e.get('rect')) for e in x.get('stack',[])[:4]]) for x in probe.get('points',[])])
          assert files['old_main'].read_bytes()!=files['old_candidate'].read_bytes(),'Historical failure missing'
          assert files['new_main'].read_bytes()==files['new_control'].read_bytes(),'Targeted A/A mismatch'
          assert files['new_main'].read_bytes()==files['new_candidate'].read_bytes(),'Targeted A/B mismatch'
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mui-v70-paint-attribution-${{ matrix.case.label }}
          path: diagnosis/
          if-no-files-found: error
          retention-days: 7
