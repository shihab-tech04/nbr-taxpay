name: MUI v5.4 exact candidate strict full homepage acceptance
on:
  push:
    branches: [ops/mui-v4-visual-baseline-bb3fcb77]
permissions:
  contents: read
jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CI: 'true'
      VITE_SUPABASE_DISABLED: 'true'
      VITE_SUPABASE_URL: ''
      VITE_SUPABASE_PUBLISHABLE_KEY: ''
      BASE_SHA: 1d96c6dffe6e11256beedbbf9ad8925d5e3f1982
      CANDIDATE_SHA: de410ce36d859f2cf6ff053f38f59ff264af11bc
    steps:
      - uses: actions/checkout@v4
        with:
          ref: de410ce36d859f2cf6ff053f38f59ff264af11bc
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
      - name: Build exact candidate and Main with original dependencies
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          git merge-base --is-ancestor "$BASE_SHA" "$CANDIDATE_SHA"
          npm ci --no-audit --no-fund
          npm run build
          git show "${{ github.sha }}:tests/visual/mui-v54-deterministic-home.spec.ts" > tests/visual/mui-v4-protected-home.spec.ts
          export MUI_BASELINE_DIR="$RUNNER_TEMP/mui-exact-main"
          mkdir -p "$MUI_BASELINE_DIR"
          git archive "$BASE_SHA" | tar -x -C "$MUI_BASELINE_DIR"
          (cd "$MUI_BASELINE_DIR" && npm ci --no-audit --no-fund && npm run build)
          npx playwright install chromium
      - name: Strict full matrix, preselected exact methods and independent A/A before A/B
        run: |
          set -euo pipefail
          export MUI_BASELINE_DIR="$RUNNER_TEMP/mui-exact-main"
          export MUI_SNAPSHOT_DIR="$RUNNER_TEMP/mui-snapshots"
          mkdir -p "$MUI_SNAPSHOT_DIR"
          printf '%s\n' "$BASE_SHA" > "$MUI_SNAPSHOT_DIR/BASE_SHA"
          printf '%s\n' "$CANDIDATE_SHA" > "$MUI_SNAPSHOT_DIR/CANDIDATE_SHA"
          npx playwright test --config playwright.mui-protected.config.ts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mui-v54-exact-full-home-matrix
          path: |
            ${{ runner.temp }}/mui-snapshots
            test-results/
          if-no-files-found: error
          retention-days: 7
