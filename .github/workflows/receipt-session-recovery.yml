name: TaxPay receipt session recovery acceptance

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/components/screens/ReceiptLookup.tsx'
      - 'src/services/simulatedPaymentStory.ts'
      - 'tests/e2e/receipt-session-recovery.spec.ts'
      - 'tests/e2e/receipt-modal-unification.spec.ts'
      - '.github/workflows/receipt-session-recovery.yml'
  push:
    branches: [main]
    paths:
      - 'src/components/screens/ReceiptLookup.tsx'
      - 'src/services/simulatedPaymentStory.ts'
      - 'tests/e2e/receipt-session-recovery.spec.ts'
      - 'tests/e2e/receipt-modal-unification.spec.ts'
      - '.github/workflows/receipt-session-recovery.yml'

permissions:
  contents: read

jobs:
  recover-session-receipt:
    name: Session-owned receipt readback and privacy
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Type/domain checks
        run: |
          npm run lint
          npm run test:domain
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Verify receipt recovery and fail-closed errors at mobile and desktop widths
        env:
          VITE_SUPABASE_DISABLED: 'true'
          VITE_SUPABASE_URL: ''
          VITE_SUPABASE_PUBLISHABLE_KEY: ''
        run: npx playwright test tests/e2e/receipt-session-recovery.spec.ts tests/e2e/receipt-modal-unification.spec.ts
      - name: Upload failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: taxpay-receipt-session-recovery
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
