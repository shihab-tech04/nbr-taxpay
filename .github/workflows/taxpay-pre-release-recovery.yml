name: TaxPay pre-release recovery snapshot

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  full-history-recovery:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Capture full branch history and verify offline restore
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p recovery
          git fetch --no-tags origin '+refs/heads/*:refs/remotes/origin/*'
          git bundle create recovery/taxpay-full-history.bundle --all
          git bundle verify recovery/taxpay-full-history.bundle
          git archive --format=tar HEAD | gzip -9 > recovery/taxpay-source.tar.gz
          git clone --mirror recovery/taxpay-full-history.bundle /tmp/taxpay-restored.git
          git --git-dir=/tmp/taxpay-restored.git fsck --full --no-reflogs
          printf 'repository=shihab-tech04/nbr-taxpay\nhead=%s\nmain=%s\n' "$(git rev-parse HEAD)" "$(git rev-parse refs/remotes/origin/main)" > recovery/MANIFEST.txt
          (cd recovery && sha256sum taxpay-full-history.bundle taxpay-source.tar.gz > SHA256SUMS.txt)
          (cd recovery && sha256sum -c SHA256SUMS.txt)
          cat recovery/MANIFEST.txt recovery/SHA256SUMS.txt
      - name: Upload checked and offline-restored history snapshot
        uses: actions/upload-artifact@v4
        with:
          name: taxpay-pre-release-full-git-recovery
          path: recovery/
          retention-days: 14
          if-no-files-found: error
