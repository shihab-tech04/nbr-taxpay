name: Verified pre-release source recovery
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-backup:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - name: Create source and full-history recovery archives
        shell: bash
        run: |
          set -euo pipefail
          BASE_SHA="$(git rev-parse HEAD)"
          mkdir -p recovery
          git bundle create "recovery/pre-release-history.bundle" --all
          git bundle verify "recovery/pre-release-history.bundle"
          git archive --format=tar "$BASE_SHA" | gzip -9 > "recovery/pre-release-source.tar.gz"
          printf '%s\n' "$BASE_SHA" > recovery/BASE_SHA
          (cd recovery && sha256sum pre-release-history.bundle pre-release-source.tar.gz BASE_SHA > SHA256SUMS)
          (cd recovery && sha256sum --check SHA256SUMS)
      - name: Independent git bundle restore test
        shell: bash
        run: |
          set -euo pipefail
          BASE_SHA="$(cat recovery/BASE_SHA)"
          mkdir -p /tmp/pre-release-restore
          git clone --mirror recovery/pre-release-history.bundle /tmp/pre-release-restore/restore.git
          git --git-dir=/tmp/pre-release-restore/restore.git cat-file -e "$BASE_SHA^{commit}"
          git --git-dir=/tmp/pre-release-restore/restore.git fsck --full --strict
          mkdir -p /tmp/pre-release-restore/source
          tar -xzf recovery/pre-release-source.tar.gz -C /tmp/pre-release-restore/source
          test -f /tmp/pre-release-restore/source/package.json
          echo "RECOVERY_RESTORE_PASS_SHA=$BASE_SHA"
      # A short-lived review snapshot lets the auditor inspect the entire exact PR
      # source (not an older main checkout), including dynamic CSS and tests.
      - name: Checkout exact PR source for line-by-line audit
        if: github.event_name == 'pull_request'
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: review-head
          persist-credentials: false
      - name: Archive and checksum exact PR source
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          HEAD_SHA="$(git -C review-head rev-parse HEAD)"
          test "$HEAD_SHA" = "${{ github.event.pull_request.head.sha }}"
          git -C review-head archive --format=tar.gz -o ../recovery/review-head-source.tar.gz "$HEAD_SHA"
          printf '%s\n' "$HEAD_SHA" > recovery/REVIEW_HEAD_SHA
          (cd recovery && sha256sum review-head-source.tar.gz REVIEW_HEAD_SHA > REVIEW_SHA256SUMS)
          (cd recovery && sha256sum --check REVIEW_SHA256SUMS)
      - uses: actions/upload-artifact@v4
        with:
          name: pre-release-recovery-${{ github.event.pull_request.number || github.run_id }}
          path: recovery/
          retention-days: 1
          if-no-files-found: error
