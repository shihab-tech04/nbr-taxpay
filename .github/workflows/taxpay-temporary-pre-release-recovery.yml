name: TaxPay temporary pre-release Git recovery

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verified-history:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Capture and independently restore full Git history
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p recovery
          git fetch --no-tags origin '+refs/heads/*:refs/remotes/origin/*'
          git bundle create recovery/taxpay-full-history.bundle --all
          git bundle verify recovery/taxpay-full-history.bundle
          git archive --format=tar HEAD | gzip -9 > recovery/taxpay-source.tar.gz
          git clone --mirror recovery/taxpay-full-history.bundle /tmp/taxpay-restored.git
          git --git-dir=/tmp/taxpay-restored.git fsck --full --no-reflogs
          git --git-dir=/tmp/taxpay-restored.git cat-file -e refs/remotes/origin/main^{commit}
          printf 'repository=shihab-tech04/nbr-taxpay\npre_release_main=%s\npr_head=%s\n' "$(git rev-parse refs/remotes/origin/main)" "$(git rev-parse HEAD)" > recovery/MANIFEST.txt
          (cd recovery && sha256sum taxpay-full-history.bundle taxpay-source.tar.gz > SHA256SUMS.txt)
          (cd recovery && sha256sum -c SHA256SUMS.txt)
          cat recovery/MANIFEST.txt recovery/SHA256SUMS.txt
      - name: Upload offline-restorable backup
        uses: actions/upload-artifact@v4
        with:
          name: taxpay-temporary-pre-release-recovery
          path: recovery/
          retention-days: 14
          if-no-files-found: error
