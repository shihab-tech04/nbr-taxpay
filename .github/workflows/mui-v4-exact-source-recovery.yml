name: MUI exact archived-source recovery and build
on:
  push:
    branches: [ops/mui-recovery-verify-fd1dc671]
permissions:
  contents: read
  actions: read
jobs:
  restore-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      BASE_SHA: 594fcca473e3349923c32783aff6817baa98f9e1
      VITE_SUPABASE_DISABLED: 'true'
      VITE_SUPABASE_URL: ''
      VITE_SUPABASE_PUBLISHABLE_KEY: ''
    steps:
      - name: Download exact existing recovery artifact (same bytes as independently verified Library)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/recovery"
          curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/${{ github.repository }}/actions/artifacts/15051516252/zip" -o "$RUNNER_TEMP/recovery.zip"
          printf '%s  %s\n' '400dec05eab71c0729f3709c019e856ffd15fcdc63fc1fa45abdf11b0d14e8ea' "$RUNNER_TEMP/recovery.zip" | sha256sum -c -
          unzip -q "$RUNNER_TEMP/recovery.zip" -d "$RUNNER_TEMP/recovery"
          cd "$RUNNER_TEMP/recovery"
          sha256sum -c SHA256SUMS
          test "$(cat BASE_SHA)" = "$BASE_SHA"
          git clone --mirror pre-release-history.bundle "$RUNNER_TEMP/restored.git"
          git -C "$RUNNER_TEMP/restored.git" fsck --full --strict
          test "$(git -C "$RUNNER_TEMP/restored.git" rev-parse refs/heads/main)" = "$BASE_SHA"
          git clone --no-local "$RUNNER_TEMP/restored.git" "$RUNNER_TEMP/restored-source"
          git -C "$RUNNER_TEMP/restored-source" checkout --detach "$BASE_SHA"
          mkdir "$RUNNER_TEMP/archive-source"
          tar -xzf pre-release-source.tar.gz -C "$RUNNER_TEMP/archive-source"
          diff -qr --exclude=.git "$RUNNER_TEMP/archive-source" "$RUNNER_TEMP/restored-source"
      - uses: actions/setup-node@v7
        with:
          node-version-file: ${{ runner.temp }}/restored-source/.node-version
      - name: Build the restored exact archived source
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/restored-source"
          test "$(git rev-parse HEAD)" = "$BASE_SHA"
          node --version
          npm ci --no-audit --no-fund
          npm run lint
          npm run build
          test -f dist/index.html
          du -sb dist
          echo "RECOVERED_BUILD_PASS_SHA=$BASE_SHA"
  remote-recovery-tag:
    needs: restore-and-build
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 594fcca473e3349923c32783aff6817baa98f9e1
          fetch-depth: 0
      - name: Create exact recovery tag without replacing a tag
        run: |
          set -euo pipefail
          expected=594fcca473e3349923c32783aff6817baa98f9e1
          tag=recovery/mui-v4-594fcca4
          current="$(git ls-remote origin "refs/tags/$tag" | cut -f1)"
          if [ -z "$current" ]; then git push origin "$expected:refs/tags/$tag"; else test "$current" = "$expected"; fi
          test "$(git ls-remote origin "refs/tags/$tag" | cut -f1)" = "$expected"
