name: MUI v4 exact-source independent recovery
on:
  push:
    branches: [ops/mui-recovery-verify-bb3fcb77]
permissions:
  contents: read
jobs:
  restore-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      BASE_SHA: bb3fcb774695350e93f00d3fd3c27fadbac56ee0
      VITE_SUPABASE_DISABLED: 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: bb3fcb774695350e93f00d3fd3c27fadbac56ee0
          fetch-depth: 0
          persist-credentials: false
      - name: Bundle exact source and all fetched refs
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$BASE_SHA"
          git update-ref refs/heads/mui-recovery-exact "$BASE_SHA"
          git tag mui-v4-local-recovery-bb3fcb77 "$BASE_SHA"
          mkdir -p "$RUNNER_TEMP/recovery"
          git bundle create "$RUNNER_TEMP/recovery/history.bundle" --all
          git bundle verify "$RUNNER_TEMP/recovery/history.bundle"
          git archive "$BASE_SHA" | gzip -n > "$RUNNER_TEMP/recovery/source.tar.gz"
          git for-each-ref --format='%(objectname) %(refname)' > "$RUNNER_TEMP/recovery/REFS.txt"
          printf '%s\n' "$BASE_SHA" > "$RUNNER_TEMP/recovery/BASE_SHA"
          (cd "$RUNNER_TEMP/recovery" && sha256sum history.bundle source.tar.gz REFS.txt BASE_SHA > SHA256SUMS && sha256sum -c SHA256SUMS)
      - name: Restore in independent repository and compare source
        shell: bash
        run: |
          set -euo pipefail
          git clone --mirror "$RUNNER_TEMP/recovery/history.bundle" "$RUNNER_TEMP/restored.git"
          git -C "$RUNNER_TEMP/restored.git" fsck --full --strict
          test "$(git -C "$RUNNER_TEMP/restored.git" rev-parse refs/heads/mui-recovery-exact)" = "$BASE_SHA"
          git clone --no-local "$RUNNER_TEMP/restored.git" "$RUNNER_TEMP/restored-source"
          git -C "$RUNNER_TEMP/restored-source" checkout --detach "$BASE_SHA"
          mkdir "$RUNNER_TEMP/archive-source"
          tar -xzf "$RUNNER_TEMP/recovery/source.tar.gz" -C "$RUNNER_TEMP/archive-source"
          diff -qr --exclude=.git "$RUNNER_TEMP/archive-source" "$RUNNER_TEMP/restored-source"
          echo "EXACT_RESTORE_PASS_SHA=$BASE_SHA"
      - uses: actions/upload-artifact@v4
        with:
          name: mui-v4-exact-recovery-bb3fcb77
          path: ${{ runner.temp }}/recovery
          if-no-files-found: error
          retention-days: 7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
      - name: Build restored checkout without hosted credentials
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/restored-source"
          test "$(git rev-parse HEAD)" = "$BASE_SHA"
          node --version
          npm ci --no-audit --no-fund
          npm run lint
          npm run build
          test -f dist/index.html
          du -sb dist
          echo "RECOVERED_BUILD_PASS_SHA=$BASE_SHA"
