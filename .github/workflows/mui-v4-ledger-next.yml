name: MUI v4 combined non-homepage acceptance
on:
  push:
    branches: [ops/mui-v4-ledger-next-766f320]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CI: 'true'
      VITE_SUPABASE_DISABLED: 'true'
      VITE_SUPABASE_URL: ''
      VITE_SUPABASE_PUBLISHABLE_KEY: ''
      BASE_SHA: dd366bbfb97d09faf6252f43d1f3b3d07d6ad88f
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
      - name: Confirm exact source boundaries and dependency lock
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "$BASE_SHA" HEAD
          test -z "$(git diff "$BASE_SHA" HEAD -- src/App.tsx src/index.css src/styles src/components/layout src/services supabase src/components/screens/PublicLanding.tsx src/components/screens/Home2Layout.tsx src/components/screens/home2 src/components/screens/home3 src/components/screens/PublicHeroCarousel.tsx src/components/screens/PaymentServiceChoiceDialog.tsx src/components/screens/TaxpayerLoginDialog.tsx)"
          npm ci --no-audit --no-fund
          node scripts/ci/mui-v52-source-inventory.mjs
          npm run lint
          node --input-type=module -e 'import {createServer} from "vite"; const server=await createServer({server:{middlewareMode:true},appType:"custom"}); try { const m=await server.ssrLoadModule("/tests/muiV53RecordControls.test.tsx"); m.verifyRecordControls(); } finally { await server.close(); }'
          env -u VITE_SUPABASE_DISABLED -u VITE_SUPABASE_URL -u VITE_SUPABASE_PUBLISHABLE_KEY npm run test:domain
          npm run build
          du -sb dist
      - run: npx playwright install chromium
      - name: Verify all migrated controls, legal content, ledger and native validation
        run: |
          npx playwright test tests/e2e/mui-v4-glossary-pilot.spec.ts tests/e2e/mui-v4-guide-catalogue.spec.ts tests/e2e/mui-v4-ledger-pilot.spec.ts tests/e2e/mui-v4-public-forms.spec.ts tests/e2e/event-based-ledger-payment-history.spec.ts tests/e2e/public-guest-guide.spec.ts tests/e2e/public-guidance-p3.spec.ts tests/e2e/signed-in-payment-entry.spec.ts --workers=2
      - name: Verify complete catalogue transport with synthetic read-only source fixture
        env:
          VITE_SUPABASE_DISABLED: 'false'
          VITE_SUPABASE_URL: 'https://catalogue-test.invalid'
          VITE_SUPABASE_PUBLISHABLE_KEY: 'synthetic-public-test-key'
          MUI_SYNTHETIC_CATALOGUE: 'true'
        run: npx playwright test tests/e2e/head-catalogue.spec.ts --workers=2
      - name: Verify integrated account controls and source proposal forms
        env:
          VITE_SUPABASE_DISABLED: 'false'
          VITE_SUPABASE_URL: 'https://nbr-taxpay-test.invalid'
          VITE_SUPABASE_PUBLISHABLE_KEY: 'synthetic-public-test-key'
        run: npx playwright test tests/e2e/account-tax-journey-private.spec.ts tests/e2e/mui-v51-review-controls.spec.ts tests/e2e/mui-v52-source-proposals.spec.ts tests/e2e/taxpay-notification-register-ux.spec.ts tests/e2e/mui-v54-record-consumers.spec.ts tests/e2e/mui-v55-timeline-status.spec.ts --workers=2
      - name: Verify all direct authorization actions and scoped record control contracts
        run: npx playwright test tests/e2e/manage-authorization-desktop.spec.ts --workers=2
      - name: Verify integrated public service directory
        run: npx playwright test tests/e2e/citizen-copy-cleanup.spec.ts --workers=2
      - name: Verify private and preview dashboard layouts and account controls
        env:
          VITE_SUPABASE_DISABLED: 'false'
          VITE_SUPABASE_URL: 'https://nbr-taxpay-test.invalid'
          VITE_SUPABASE_PUBLISHABLE_KEY: 'synthetic-public-test-key'
        run: npx playwright test tests/e2e/dashboard-unified-preview.spec.ts tests/e2e/account-dashboard-private-activity.spec.ts --workers=2
      - name: Verify dashboard analytics MUI action family and retained chart geometry
        run: npx playwright test tests/e2e/mui-v60-dashboard-analytics.spec.ts tests/e2e/dashboard-bento-layout-regression.spec.ts tests/e2e/user1-dashboard-financial-ux.spec.ts tests/e2e/user1-dashboard-ux-cleanup.spec.ts --workers=2
      - name: Preserve latest Main recipient notification and payment activity
        env:
          VITE_SUPABASE_DISABLED: 'false'
          VITE_SUPABASE_URL: 'https://nbr-taxpay-test.invalid'
          VITE_SUPABASE_PUBLISHABLE_KEY: 'synthetic-public-test-key'
          VITE_ACCOUNT_RECEIVED_NOTICES_ENABLED: 'true'
        run: npx playwright test tests/e2e/authenticated-received-notice-mount.spec.ts --workers=2
      - name: Preserve recipient report lifecycle and MUI notification re-entry
        env:
          VITE_SUPABASE_DISABLED: 'false'
          VITE_SUPABASE_URL: 'https://nbr-taxpay-test.invalid'
          VITE_SUPABASE_PUBLISHABLE_KEY: 'synthetic-public-test-key'
          VITE_RECIPIENT_NOTICE_FEED_ENABLED: 'true'
        run: npx playwright test tests/e2e/preview-recipient-report.spec.ts --project=desktop-1280 --project=mobile-320 --project=mobile-375 --workers=1
      - name: Compare unchanged Main and combined candidate across full home matrix
        run: |
          set -euo pipefail
          export MUI_BASELINE_DIR="$RUNNER_TEMP/mui-exact-main"
          export MUI_SNAPSHOT_DIR="$RUNNER_TEMP/mui-snapshots"
          mkdir -p "$MUI_BASELINE_DIR" "$MUI_SNAPSHOT_DIR" mui-evidence
          git archive "$BASE_SHA" | tar -x -C "$MUI_BASELINE_DIR"
          (
            cd "$MUI_BASELINE_DIR"
            npm ci --no-audit --no-fund
            npm run build
            du -sb dist > "$RUNNER_TEMP/base-build-bytes.txt"
          )
          du -sb dist > mui-evidence/candidate-build-bytes.txt
          cp "$RUNNER_TEMP/base-build-bytes.txt" mui-evidence/
          npx playwright test --config playwright.mui-protected.config.ts
      - name: Collect evidence
        if: always()
        run: |
          mkdir -p mui-evidence
          if [ -d "$RUNNER_TEMP/mui-snapshots" ]; then cp -R "$RUNNER_TEMP/mui-snapshots" mui-evidence/; fi
          git rev-parse HEAD > mui-evidence/CANDIDATE_SHA
          git diff --name-only "$BASE_SHA" HEAD > mui-evidence/CHANGED_FILES
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mui-v4-combined-acceptance
          path: |
            mui-evidence/
            test-results/
            playwright-report/
          if-no-files-found: error
          retention-days: 7
