name: WS5 recipient functional projection acceptance
on:
  push:
    branches: [ws5/recipient-functional-closure-next-20261126]
permissions:
  contents: read
jobs:
  lifecycle-report-sql:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: supabase/setup-cli@v3
        with:
          version: latest
      - name: Isolate disposable database
        run: |
          python3 scripts/ci/isolate-local-supabase.py
          supabase start -x studio,imgproxy,realtime,storage-api,logflare,vector,supavisor,postgres-meta
      - name: Rehearse transactional rollback of staged lifecycle and report migrations
        run: |
          set -euo pipefail
          export PGHOST=127.0.0.1 PGPORT="$TAXPAY_LOCAL_DB_PORT" PGDATABASE=postgres PGUSER=postgres PGPASSWORD=postgres
          pg_dump --schema-only --no-password > /tmp/before.sql
          { echo 'begin;'; sed -E '/^(begin|commit);$/Id' scripts/ci/recipient-lifecycle-candidate.sql scripts/ci/recipient-report-intake-candidate.sql; echo 'rollback;'; } > /tmp/rehearsal.sql
          psql -X -v ON_ERROR_STOP=1 -f /tmp/rehearsal.sql
          pg_dump --schema-only --no-password > /tmp/after.sql
          diff -u <(sed -E '/^\\(un)?restrict /d' /tmp/before.sql) <(sed -E '/^\\(un)?restrict /d' /tmp/after.sql)
      - name: Generate ordered migration filenames using official CLI
        run: |
          supabase --version
          supabase migration new --help
          supabase migration new recipient_payment_lifecycle
          sleep 1
          supabase migration new recipient_report_intake
          find supabase/migrations -name '*_recipient_payment_lifecycle.sql' -o -name '*_recipient_report_intake.sql'
      - name: Apply staged candidate and verify exact lifecycle and report intake
        run: |
          set -euo pipefail
          export PGHOST=127.0.0.1 PGPORT="$TAXPAY_LOCAL_DB_PORT" PGDATABASE=postgres PGUSER=postgres PGPASSWORD=postgres
          psql -X -v ON_ERROR_STOP=1 -f scripts/ci/recipient-lifecycle-candidate.sql
          psql -X -v ON_ERROR_STOP=1 -f scripts/ci/recipient-report-intake-candidate.sql
          psql -X -v ON_ERROR_STOP=1 -f tests/integration/recipientLifecycleReportCandidate.sql
      - name: Clean disposable database
        if: always()
        run: supabase stop --no-backup
