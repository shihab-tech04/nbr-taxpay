name: WS3 legacy handoff RPC permission regression
on:
  push:
    branches:
      - release/taxpay-correction-notifications-20261101
    paths:
      - 'supabase/migrations/20261117054000_taxpay_legacy_handoff_rpc_public_privilege_gate.sql'
      - 'tests/integration/taxpayLegacyHandoffPrivilegeFixture.sql'
      - 'tests/integration/taxpayLegacyHandoffPrivilegeAcceptance.sql'
      - '.github/workflows/ws3-legacy-handoff-privileges.yml'
      - 'supabase/functions/taxpay-handoff-api/index.ts'
      - 'tests/integration/ws3LegacyHandoffRetirement.test.mjs'
  pull_request:
    branches: [main]
    paths:
      - 'supabase/migrations/20261117054000_taxpay_legacy_handoff_rpc_public_privilege_gate.sql'
      - 'tests/integration/taxpayLegacyHandoffPrivilegeFixture.sql'
      - 'tests/integration/taxpayLegacyHandoffPrivilegeAcceptance.sql'
      - '.github/workflows/ws3-legacy-handoff-privileges.yml'
      - 'supabase/functions/taxpay-handoff-api/index.ts'
      - 'tests/integration/ws3LegacyHandoffRetirement.test.mjs'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  isolated-pg17-permissions:
    name: WS3 fail-closed legacy handoff RPC security
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ws3_legacy_rpc
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d ws3_legacy_rpc"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGDATABASE: ws3_legacy_rpc
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - name: Install PostgreSQL client
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client
      - name: Reproduce legacy SECURITY DEFINER grants without user data
        run: psql -X -v ON_ERROR_STOP=1 -f tests/integration/taxpayLegacyHandoffPrivilegeFixture.sql
      - name: Apply exact WS3 privilege migration on disposable PostgreSQL 17
        run: psql -X -v ON_ERROR_STOP=1 -f supabase/migrations/20261117054000_taxpay_legacy_handoff_rpc_public_privilege_gate.sql
      - name: Verify anon/auth DENY and service_role ALLOW
        run: psql -X -v ON_ERROR_STOP=1 -f tests/integration/taxpayLegacyHandoffPrivilegeAcceptance.sql
      - name: Exercise retired Edge routes and confirm current Story1 unaffected
        run: node --test tests/integration/ws3LegacyHandoffRetirement.test.mjs
