name: WS5 recipient notice presentation and exact rollback rehearsal
on:
  push:
    branches: [ws5/recipient-notice-presentation-next-20261126]
permissions:
  contents: read
jobs:
  exact-rollback:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: supabase/setup-cli@v3
        with:
          version: latest
      - name: Isolate local database only
        run: |
          python3 scripts/ci/isolate-local-supabase.py
          supabase start -x studio,imgproxy,realtime,storage-api,logflare,vector,supavisor,postgres-meta
      - name: Rehearse exact hosted function rollback, reapply and immutable row check
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          sql=Path('supabase/migrations/20261114010000_taxpay_demo_recipient_notice_queue.sql').read_text()
          start=sql.index('CREATE FUNCTION public.taxpay_demo_received_payment_notices(')
          rollback=sql[start:sql.rindex('COMMIT;')].replace('CREATE FUNCTION public.taxpay_demo_received_payment_notices(', 'CREATE OR REPLACE FUNCTION public.taxpay_demo_received_payment_notices(',1)
          Path('/tmp/notice-rollback.sql').write_text(rollback)
          PY
          PGHOST=127.0.0.1 PGPORT="$TAXPAY_LOCAL_DB_PORT" PGDATABASE=postgres PGUSER=postgres PGPASSWORD=postgres psql -X -v ON_ERROR_STOP=1 -v rollback_file=/tmp/notice-rollback.sql -f tests/integration/recipientNoticeFunctionRollback.sql
      - name: Clean disposable project
        if: always()
        run: supabase stop --no-backup
  presentation:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: node --import tsx --test tests/receivedPaymentNoticePresentation.test.ts tests/demoReceivedPaymentNotices.test.ts tests/receivedNoticeRegisterScope.test.ts
      - run: npx playwright install chromium
      - name: Verify legacy and completed notice popup EN/BN on desktop and phone
        run: npx playwright test tests/e2e/authenticated-received-notice-mount.spec.ts --project=desktop-1280 --project=mobile-320 --project=mobile-375 --workers=1
        env:
          VITE_SUPABASE_DISABLED: 'false'
          VITE_SUPABASE_URL: 'https://nbr-taxpay-test.invalid'
          VITE_SUPABASE_PUBLISHABLE_KEY: 'synthetic-public-test-key'
          VITE_ACCOUNT_RECEIVED_NOTICES_ENABLED: 'true'
